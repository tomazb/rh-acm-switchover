apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acm-owner-prune
  namespace: openshift-gitops
  labels:
    acm-switchover.redhat-lab/topology: 2hub-3mc-sno
    acm-switchover.redhat-lab/fixture-scope: argocd-acm-hostile-mode
    acm-switchover.redhat-lab/gitops-mode: hostile-prune
spec:
  project: default
  source:
    repoURL: https://git.example.invalid/acm-switchover-lab.git
    targetRevision: HEAD
    path: tests/release/kustomize/bases/acm-dr-objects
  destination:
    name: in-cluster
    namespace: open-cluster-management-backup
  syncPolicy:
    automated:
      prune: true
status:
  resources:
    - group: ""
      kind: ConfigMap
      namespace: open-cluster-management-backup
      name: acm-policy-desired-state
      status: Synced
