apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acm-owner-static
  namespace: openshift-gitops
  labels:
    acm-switchover.redhat-lab/topology: 2hub-3mc-sno
    acm-switchover.redhat-lab/fixture-scope: argocd-acm-ownership
    acm-switchover.redhat-lab/gitops-mode: owns-acm-static
spec:
  project: default
  source:
    repoURL: https://git.example.invalid/acm-switchover-lab.git
    targetRevision: HEAD
    path: tests/release/kustomize/bases/argocd-acm-ownership/owned-resources
  destination:
    name: in-cluster
    namespace: open-cluster-management-backup
status:
  resources:
    - group: ""
      kind: ConfigMap
      namespace: open-cluster-management-backup
      name: argocd-acm-owned-marker
      status: Synced
