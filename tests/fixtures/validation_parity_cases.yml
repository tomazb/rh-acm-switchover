- name: valid passive patch operation
  kind: operation
  input:
    operation:
      restore_only: false
      method: passive
      activation_method: patch
      old_hub_action: secondary
    execution:
      mode: execute
    features:
      argocd:
        manage: false
  expected:
    passed: true

- name: resume_on_failure requires argocd manage
  kind: operation
  input:
    operation:
      restore_only: false
      method: passive
      activation_method: patch
      old_hub_action: secondary
    execution:
      mode: execute
    features:
      argocd:
        manage: false
        resume_on_failure: true
  expected:
    passed: false
    contains: "argocd"

- name: resume_on_failure rejected in validate mode
  kind: operation
  input:
    operation:
      restore_only: false
      method: passive
      activation_method: patch
      old_hub_action: secondary
    execution:
      mode: validate
    features:
      argocd:
        manage: true
        resume_on_failure: true
  expected:
    passed: false
    contains: "validate"

- name: resume_on_failure valid with argocd manage
  kind: operation
  input:
    operation:
      restore_only: false
      method: passive
      activation_method: patch
      old_hub_action: secondary
    execution:
      mode: execute
    features:
      argocd:
        manage: true
        resume_on_failure: true
  expected:
    passed: true

- name: argocd manage valid in validate mode
  kind: operation
  input:
    operation:
      restore_only: false
      method: passive
      activation_method: patch
      old_hub_action: secondary
    execution:
      mode: validate
    features:
      argocd:
        manage: true
        resume_on_failure: false
  expected:
    passed: true

- name: normal two hub rejects same context
  kind: hub_contexts
  input:
    hub_contexts:
      primary: shared-hub
      secondary: shared-hub
    operation:
      restore_only: false
      method: passive
      old_hub_action: secondary
    execution:
      mode: execute
  expected:
    passed: false
    contains: "Primary and secondary Kubernetes context names must differ for a normal two-hub switchover."

- name: restore only excludes same context guard
  kind: hub_contexts
  input:
    hub_contexts:
      primary: null
      secondary: shared-hub
    operation:
      restore_only: true
      method: full
      old_hub_action: none
    execution:
      mode: execute
  expected:
    passed: true

- name: distinct hub contexts pass
  kind: hub_contexts
  input:
    hub_contexts:
      primary: primary-hub
      secondary: secondary-hub
    operation:
      restore_only: false
      method: passive
      old_hub_action: secondary
    execution:
      mode: execute
  expected:
    passed: true

- name: equal physical hub identities are refused
  kind: hub_identity
  input:
    hub_identities:
      primary:
        cluster_uid: physical-uid
      secondary:
        cluster_uid: " physical-uid "
  expected:
    passed: false
    contains: "Primary and secondary hubs resolve to the same physical Kubernetes cluster. Refusing the normal two-hub switchover."

- name: malformed primary physical identity is refused
  kind: hub_identity
  input:
    hub_identities:
      primary:
        cluster_uid: " "
      secondary:
        cluster_uid: secondary-uid
  expected:
    passed: false
    contains: "Unable to verify the primary hub physical identity from the live kube-system Namespace UID. Refusing the normal two-hub switchover."

- name: malformed secondary physical identity is refused
  kind: hub_identity
  input:
    hub_identities:
      primary:
        cluster_uid: primary-uid
      secondary:
        cluster_uid: null
  expected:
    passed: false
    contains: "Unable to verify the secondary hub physical identity from the live kube-system Namespace UID. Refusing the normal two-hub switchover."

- name: distinct physical hub identities pass
  kind: hub_identity
  input:
    hub_identities:
      primary:
        cluster_uid: primary-uid
      secondary:
        cluster_uid: secondary-uid
  expected:
    passed: true

- name: valid relative path
  kind: path
  input:
    path: .state/switchover-state.json
  expected:
    passed: true

- name: valid tmp absolute path
  kind: path
  input:
    path: /tmp/acm-switchover/state.json
  expected:
    passed: true

- name: disallowed absolute root rejected
  kind: path
  input:
    path: /etc/acm-switchover/state.json
  expected:
    passed: false
    contains: "allowed"

- name: tilde path rejected
  kind: path
  input:
    path: ~/.kube/config
  expected:
    passed: false
    contains: "unsafe characters"

- name: traversal path rejected
  kind: path
  input:
    path: ./artifacts/../outside/report.json
  expected:
    passed: false
    contains: "Path traversal attempt"

- name: valid relative artifact path
  kind: artifact_path
  input:
    path: artifacts/reports/switchover-report.json
  expected:
    passed: true

- name: valid tmp artifact path with missing ancestors
  kind: artifact_path
  input:
    path: /tmp/acm-switchover/missing/reports/switchover-report.json
  expected:
    passed: true

- name: artifact traversal path rejected
  kind: artifact_path
  input:
    path: artifacts/../outside/report.json
  expected:
    passed: false
    contains: "Path traversal attempt"

- name: artifact disallowed absolute root rejected
  kind: artifact_path
  input:
    path: /etc/acm-switchover/report.json
  expected:
    passed: false
    contains: "allowed"

- name: artifact tmp prefix confusion rejected
  kind: artifact_path
  input:
    path: /tmp-not-allowed/acm-switchover/report.json
  expected:
    passed: false
    contains: "allowed"
