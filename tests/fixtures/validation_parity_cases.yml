# R4-04 plan Task 6: the expected-ManagedCluster waiver and the cleanup-repair request.
# The collection names the request by a non-empty field of its dict; the Python CLI by its
# flag, which the parity harness sets whenever the fixture's dict names any field.
- name: complete activation waiver is accepted
  kind: operation
  input:
    operation:
      restore_only: false
      method: passive
      activation_method: patch
      old_hub_action: secondary
      skip_managed_cluster_expectations: true
      managed_cluster_expectation_waiver:
        scope: activation
        actor: operator@example.com
        reason: the primary inventory is stale
        request_id: null
    execution:
      mode: execute
  expected:
    passed: true

- name: complete both-scope waiver with request id is accepted
  kind: operation
  input:
    operation:
      restore_only: false
      method: passive
