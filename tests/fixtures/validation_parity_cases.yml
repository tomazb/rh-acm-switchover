- name: equal physical hub identities are refused
  kind: hub_identity
  input:
    hub_identities:
      primary:
        cluster_uid: physical-uid
      secondary:
        cluster_uid: " physical-uid "
  expected:
    passed: false
    message: "Primary and secondary hubs resolve to the same physical Kubernetes cluster. Refusing the normal two-hub switchover."

- name: missing primary physical identity is refused
  kind: hub_identity
  input:
    hub_identities:
      secondary:
        cluster_uid: secondary-uid
  expected:
    passed: false
    message: "Unable to verify the primary hub physical identity from the live kube-system Namespace UID. Refusing the normal two-hub switchover."

- name: malformed primary physical identity is refused
  kind: hub_identity
  input:
    hub_identities:
      primary: not-a-mapping
