- name: normal two hub rejects same context
  kind: hub_contexts
  input:
    hub_contexts:
      primary: shared-hub
      secondary: shared-hub
    operation:
      restore_only: false
      method: passive
      old_hub_action: secondary
    execution:
      mode: execute
  expected:
    passed: false
    message: "Primary and secondary Kubernetes context names must differ for a normal two-hub switchover."

