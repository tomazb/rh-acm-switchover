---
- name: Resume Argo CD auto-sync after switchover
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Resolve checkpoint path value
      ansible.builtin.set_fact:
        _argocd_resume_checkpoint_path: "{{ (acm_switchover_execution | default({})).get('checkpoint', {}).get('path', '') }}"
      when:
        - (acm_switchover_argocd.run_id | default('')) | length == 0
        - ((acm_switchover_execution | default({})).get('run_id', '') | length) == 0
        - acm_switchover_execution.checkpoint.enabled | default(false)
        - ((acm_switchover_execution | default({})).get('checkpoint', {}).get('path', '')) | length > 0

    - name: Resolve checkpoint path to absolute path (controller-side)
      ansible.builtin.set_fact:
        _argocd_resume_checkpoint_path_abs: >-
          {{
            _argocd_resume_checkpoint_path
            if (_argocd_resume_checkpoint_path | default('')).startswith('/')
            else (lookup('env', 'PWD') ~ '/' ~ _argocd_resume_checkpoint_path)
          }}
      when:
        - (acm_switchover_argocd.run_id | default('')) | length == 0
        - ((acm_switchover_execution | default({})).get('run_id', '') | length) == 0
        - acm_switchover_execution.checkpoint.enabled | default(false)
        - ((acm_switchover_execution | default({})).get('checkpoint', {}).get('path', '')) | length > 0

    - name: Validate persisted checkpoint path
      tomazb.acm_switchover.acm_safe_path_validate:
        path: "{{ _argocd_resume_checkpoint_path_abs }}"
        path_type: artifact
      when:
        - (acm_switchover_argocd.run_id | default('')) | length == 0
        - ((acm_switchover_execution | default({})).get('run_id', '') | length) == 0
        - acm_switchover_execution.checkpoint.enabled | default(false)
        - (_argocd_resume_checkpoint_path_abs | default('')) | length > 0

    - name: Check for persisted checkpoint with Argo CD run_id
      ansible.builtin.stat:
        path: "{{ _argocd_resume_checkpoint_path_abs }}"
      register: _argocd_resume_checkpoint_stat
      when:
        - (acm_switchover_argocd.run_id | default('')) | length == 0
        - ((acm_switchover_execution | default({})).get('run_id', '') | length) == 0
        - acm_switchover_execution.checkpoint.enabled | default(false)
        - (_argocd_resume_checkpoint_path_abs | default('')) | length > 0

    - name: Read persisted checkpoint file
      ansible.builtin.slurp:
        src: "{{ _argocd_resume_checkpoint_path_abs }}"
      register: _argocd_resume_checkpoint_slurp
      when:
        - (acm_switchover_argocd.run_id | default('')) | length == 0
        - ((acm_switchover_execution | default({})).get('run_id', '') | length) == 0
        - acm_switchover_execution.checkpoint.enabled | default(false)
        - (_argocd_resume_checkpoint_stat.stat.exists | default(false))

    - name: Parse persisted checkpoint JSON
      ansible.builtin.set_fact:
        _argocd_resume_checkpoint: "{{ _argocd_resume_checkpoint_slurp.content | b64decode | from_json }}"
      when:
        - (acm_switchover_argocd.run_id | default('')) | length == 0
        - ((acm_switchover_execution | default({})).get('run_id', '') | length) == 0
        - acm_switchover_execution.checkpoint.enabled | default(false)
        - (_argocd_resume_checkpoint_stat.stat.exists | default(false))

    - name: Seed Argo CD run_id from checkpoint
      ansible.builtin.set_fact:
        acm_switchover_argocd: >-
          {{
            acm_switchover_argocd | default({})
            | combine({
                'run_id': ((_argocd_resume_checkpoint | default({})).get('operational_data', {}).get('argocd_run_id'))
              })
          }}
      when:
        - (acm_switchover_argocd.run_id | default('')) | length == 0
        - ((acm_switchover_execution | default({})).get('run_id', '') | length) == 0
        - acm_switchover_execution.checkpoint.enabled | default(false)
        - _argocd_resume_checkpoint is defined
        - ((_argocd_resume_checkpoint | default({})).get('operational_data', {}).get('argocd_run_id', '')) | length > 0

    - name: Validate rehydrated Argo CD discovery namespaces from checkpoint
      ansible.builtin.assert:
        that:
          - item.value is list
        fail_msg: >-
          Checkpoint operational_data.argocd_discovery_namespaces.{{ item.key }}
          must be a list of namespace names.
      loop: >-
        {{
          (_argocd_resume_checkpoint | default({})).get('operational_data', {}).get('argocd_discovery_namespaces', {})
          | dict2items
        }}
      when:
        - acm_switchover_execution.checkpoint.enabled | default(false)
        - _argocd_resume_checkpoint is defined
        - ((_argocd_resume_checkpoint | default({})).get('operational_data', {}).get('argocd_discovery_namespaces')) is mapping
        - ((_argocd_resume_checkpoint | default({})).get('operational_data', {}).get('argocd_discovery_namespaces', {}) | length) > 0

    - name: Seed Argo CD discovery namespaces from checkpoint
      ansible.builtin.set_fact:
        acm_switchover_argocd_discovery_namespaces: >-
          {{ (_argocd_resume_checkpoint | default({})).get('operational_data', {}).get('argocd_discovery_namespaces', {}) }}
      when:
        - acm_switchover_execution.checkpoint.enabled | default(false)
        - _argocd_resume_checkpoint is defined
        - ((_argocd_resume_checkpoint | default({})).get('operational_data', {}).get('argocd_discovery_namespaces')) is mapping
        - ((_argocd_resume_checkpoint | default({})).get('operational_data', {}).get('argocd_discovery_namespaces', {}) | length) > 0
        - (acm_switchover_argocd_discovery_namespaces | default({}) | length) == 0

    - name: Read primary kube-system namespace identity
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: kube-system
        kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
        context: "{{ acm_switchover_hubs.primary.context }}"
      register: _argocd_resume_primary_identity_namespace
      when:
        - _argocd_resume_checkpoint is defined
        - acm_switchover_hubs.primary is defined
        - (acm_switchover_hubs.primary.kubeconfig | default('')) | length > 0
        - (acm_switchover_hubs.primary.context | default('')) | length > 0

    - name: Read secondary kube-system namespace identity
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: kube-system
        kubeconfig: "{{ (acm_switchover_hubs.secondary | default({})).kubeconfig | default(omit) }}"
        context: "{{ (acm_switchover_hubs.secondary | default({})).context | default(omit) }}"
      register: _argocd_resume_secondary_identity_namespace
      when:
        - _argocd_resume_checkpoint is defined
        - acm_switchover_hubs.secondary is defined
        - (acm_switchover_hubs.secondary.context | default('')) | length > 0

    - name: Publish Argo CD resume live hub identities
      ansible.builtin.set_fact:
        _argocd_resume_hub_identities:
          primary:
            context: "{{ (acm_switchover_hubs.primary | default({})).context | default('') }}"
            cluster_uid: >-
              {{
                (((_argocd_resume_primary_identity_namespace | default({})).resources | default([]) | first | default({}))
                .get('metadata', {})).get('uid', '')
              }}
          secondary:
            context: "{{ (acm_switchover_hubs.secondary | default({})).context | default('') }}"
            cluster_uid: >-
              {{
                (((_argocd_resume_secondary_identity_namespace | default({})).resources | default([]) | first | default({}))
                .get('metadata', {})).get('uid', '')
              }}
      when:
        - _argocd_resume_checkpoint is defined

    - name: Validate checkpoint identity before Argo CD resume
      tomazb.acm_switchover.acm_checkpoint_identity_validate:
        checkpoint: "{{ _argocd_resume_checkpoint }}"
        hubs: "{{ acm_switchover_hubs }}"
        operation: "{{ acm_switchover_operation | default({}) }}"
        hub_identities: "{{ _argocd_resume_hub_identities }}"
        collection_version: "{{ acm_switchover_collection_version | default('') }}"
      register: _argocd_resume_identity_validation
      when:
        - _argocd_resume_checkpoint is defined

    - name: Resolve effective hub mapping for standalone Argo CD resume
      ansible.builtin.set_fact:
        _argocd_resume_effective_hubs: >-
          {{
            acm_switchover_hubs
            if (_argocd_resume_identity_validation.matched_mapping | default('normal')) != 'swapped'
            else (
              acm_switchover_hubs
              | combine({
                  'primary': (acm_switchover_hubs.secondary | default({})),
                  'secondary': (acm_switchover_hubs.primary | default({}))
                })
            )
          }}

  tasks:
    - name: Resume autosync on secondary hub
      ansible.builtin.include_role:
        name: tomazb.acm_switchover.argocd_manage
      vars:
        acm_switchover_hubs: "{{ _argocd_resume_effective_hubs }}"
        acm_switchover_argocd_mode_override: resume
        _argocd_discover_hub: secondary

    - name: Resume autosync on primary hub
      ansible.builtin.include_role:
        name: tomazb.acm_switchover.argocd_manage
      vars:
        acm_switchover_hubs: "{{ _argocd_resume_effective_hubs }}"
        acm_switchover_argocd_mode_override: resume
        _argocd_discover_hub: primary
      when:
        - _argocd_resume_effective_hubs.primary is defined
        - ((_argocd_resume_effective_hubs.primary | default({})).kubeconfig | default('')) | length > 0
        - ((_argocd_resume_effective_hubs.primary | default({})).context | default('')) | length > 0
