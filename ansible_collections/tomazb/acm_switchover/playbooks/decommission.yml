---
- name: Decommission old ACM hub
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Require explicit primary hub target for decommission playbook
      ansible.builtin.assert:
        that:
          - acm_switchover_hubs is mapping
          - acm_switchover_hubs.primary is mapping
          - (acm_switchover_hubs.primary.kubeconfig | default('', true) | string | trim | length) > 0
          - (acm_switchover_hubs.primary.context | default('', true) | string | trim | length) > 0
        fail_msg: >-
          Decommission requires non-empty acm_switchover_hubs.primary.kubeconfig and
          acm_switchover_hubs.primary.context. Refusing to use an implicit/default kube context.

    # The standalone entry point declares itself, so every validation surface in this
    # run can tell it apart from an integrated switchover's decommission disposition.
    # This is the collection's equivalent of the Python CLI's `--decommission`, and
    # it is what makes `acm_switchover_decommission.acknowledge_observability_not_migrated`
    # refusable here: a standalone run has no destination hub to acknowledge.
    - name: Declare the standalone decommission entry point
      ansible.builtin.set_fact:
        acm_switchover_operation: >-
          {{ (acm_switchover_operation | default({}, true)) | combine({'decommission': true}) }}

  # This playbook -- NOT the shared role -- owns the standalone decommission phase
  # lifecycle. roles/finalization/tasks/handle_old_hub.yml includes the same
  # decommission role from inside an already-established two-hub `finalization`
  # checkpoint, so a role-owned lifecycle would either apply one-hub standalone
  # semantics to an integrated switchover or force the role to infer its caller.
  # Standalone mode is therefore explicit on every transition here and is never
  # inferred anywhere.
  #
  # There is no `exit` status: CHECKPOINT_VALID_STATUSES is {enter, pass, fail, reset}
  # and completion is expressed as `status: pass`, exactly as finalization does.
  # PR B issues no `reset` transition -- the action accepts one on the standalone
  # path, but nothing here may emit it.
  tasks:
    - name: Enter the standalone decommission checkpoint phase
      tomazb.acm_switchover.checkpoint_phase:
        phase: decommission
        checkpoint: "{{ acm_switchover_execution.checkpoint | default({}) }}"
        status: enter
        standalone_decommission_identity: true
      when:
        - not ansible_check_mode
        - acm_switchover_execution.checkpoint.enabled | default(false) | bool

    - name: Decommission the old hub under the standalone checkpoint phase
      block:
        - name: Run the decommission role
          ansible.builtin.include_role:
            name: tomazb.acm_switchover.decommission

        # Inside the block and after the include, never in an `always`: an `always`
        # would record a FAILED teardown as a completed phase, which lets a later
        # rerun skip work it never did.
        - name: Pass the standalone decommission checkpoint phase
          tomazb.acm_switchover.checkpoint_phase:
            phase: decommission
            checkpoint: "{{ acm_switchover_execution.checkpoint | default({}) }}"
            status: pass
            standalone_decommission_identity: true
          when:
            - not ansible_check_mode
            - acm_switchover_execution.checkpoint.enabled | default(false) | bool
      rescue:
        - name: Fail the standalone decommission checkpoint phase
          tomazb.acm_switchover.checkpoint_phase:
            phase: decommission
            checkpoint: "{{ acm_switchover_execution.checkpoint | default({}) }}"
            status: fail
            error: "{{ ansible_failed_result.msg | default('unknown decommission failure') }}"
            standalone_decommission_identity: true
          when:
            - not ansible_check_mode
            - acm_switchover_execution.checkpoint.enabled | default(false) | bool

        - name: Re-raise the original decommission failure
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('Decommission failed') }}"
