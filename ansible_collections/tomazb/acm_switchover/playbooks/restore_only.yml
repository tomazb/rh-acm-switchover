---
# Restore-only workflow: activate a Velero restore on the secondary hub
# without touching the primary hub.
#
# Phases: preflight → [ArgoCD pause] → activation → post_activation → finalization
# Skipped: primary_prep (no primary hub access)
#
# Usage:
#   ansible-playbook tomazb.acm_switchover.restore_only \
#     -e @vars/restore-only.yml
- name: ACM Hub Restore-Only
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Pin restore-only operation flags
      ansible.builtin.set_fact:
        acm_switchover_operation: >-
          {{
            acm_switchover_operation | default({})
            | combine({
                'restore_only': true,
                'method': 'full',
                'old_hub_action': 'none',
                'allow_zero_managed_clusters': acm_switchover_operation.allow_zero_managed_clusters | default(false)
              })
          }}

  tasks:
    - name: Run restore-only phases
      block:
        - name: Establish trusted identity and checkpoint barrier
          ansible.builtin.include_role:
            name: tomazb.acm_switchover.preflight
            tasks_from: identity_barrier

        # PR C decisions amendment 2.2 rule 3: a retry re-pauses Argo CD on the
        # secondary hub before any further phase work when a failure rescue left the
        # re-pause marker.
        - name: Re-pause Argo CD recorded by a failure rescue
          ansible.builtin.include_role:
            name: tomazb.acm_switchover.argocd_manage
            tasks_from: repause_recovery

        - name: Run preflight validation
          ansible.builtin.include_role:
            name: tomazb.acm_switchover.preflight
            tasks_from: post_identity

        - name: Stop after preflight when mode is validate
          ansible.builtin.meta: end_play
          when: acm_switchover_execution.mode | default('') == 'validate'

        - name: Rehydrate Argo CD run_id from checkpoint before pause
          ansible.builtin.set_fact:
            acm_switchover_argocd: >-
              {{
                acm_switchover_argocd | default({})
                | combine({
                    'run_id': ((_checkpoint_enter | default({})) or {}).get('facts', {}).get('argocd_run_id')
                  })
              }}
          when:
            - acm_switchover_features.argocd.manage | default(false)
            - acm_switchover_execution.checkpoint.enabled | default(false)
            - (acm_switchover_argocd.run_id | default('')) | length == 0
            - (((_checkpoint_enter | default({})) or {}).get('facts', {}).get('argocd_run_id', '')) | length > 0

        - name: Validate rehydrated Argo CD discovery namespaces from checkpoint
          ansible.builtin.assert:
            that:
              - (item.value | type_debug) == 'list'
            fail_msg: >-
              Checkpoint facts.argocd_discovery_namespaces.{{ item.key }}
              must be a list of namespace names.
          loop: >-
            {{
              (((_checkpoint_enter | default({})) or {}).get('facts', {}).get('argocd_discovery_namespaces', {}))
              | dict2items
            }}
          when:
            - acm_switchover_features.argocd.manage | default(false)
            - acm_switchover_execution.checkpoint.enabled | default(false)
            - (((_checkpoint_enter | default({})) or {}).get('facts', {}).get('argocd_discovery_namespaces')) is mapping
            - (((_checkpoint_enter | default({})) or {}).get('facts', {}).get('argocd_discovery_namespaces', {}) | length) > 0

        - name: Rehydrate Argo CD discovery namespaces from checkpoint before pause
          ansible.builtin.set_fact:
            acm_switchover_argocd_discovery_namespaces: >-
              {{
                (((_checkpoint_enter | default({})) or {}).get('facts', {}).get('argocd_discovery_namespaces', {}))
              }}
          when:
            - acm_switchover_features.argocd.manage | default(false)
            - acm_switchover_execution.checkpoint.enabled | default(false)
            - (acm_switchover_argocd_discovery_namespaces | default({}) | length) == 0
            - (((_checkpoint_enter | default({})) or {}).get('facts', {}).get('argocd_discovery_namespaces')) is mapping
            - (((_checkpoint_enter | default({})) or {}).get('facts', {}).get('argocd_discovery_namespaces', {}) | length) > 0

        - name: Pause Argo CD auto-sync on secondary hub before restore
          ansible.builtin.include_role:
            name: tomazb.acm_switchover.argocd_manage
          vars:
            acm_switchover_argocd_mode_override: pause
            _argocd_discover_hub: secondary
          when: acm_switchover_features.argocd.manage | default(false)

        - name: Persist Argo CD pause run_id in checkpoint for standalone resume
          tomazb.acm_switchover.checkpoint_phase:
            phase: preflight
            checkpoint: "{{ acm_switchover_execution.checkpoint | default({}) }}"
            status: pass
            operational_data:
              argocd_run_id: "{{ acm_switchover_argocd.run_id | default('') }}"
              argocd_discovery_namespaces: "{{ acm_switchover_argocd_discovery_namespaces | default({}) }}"
          when:
            - acm_switchover_features.argocd.manage | default(false)
            - acm_switchover_execution.checkpoint.enabled | default(false)
            - (acm_switchover_argocd.run_id | default(acm_switchover_execution.run_id | default(''))) | length > 0

        - name: Run activation
          ansible.builtin.include_role:
            name: tomazb.acm_switchover.activation

        - name: Run post activation verification
          ansible.builtin.include_role:
            name: tomazb.acm_switchover.post_activation

        - name: Run finalization
          ansible.builtin.include_role:
            name: tomazb.acm_switchover.finalization

      rescue:
        - name: Record the original restore-only failure
          ansible.builtin.set_fact:
            _acm_restore_only_failure: "{{ ansible_failed_result.msg | default('Restore-only workflow failed') }}"
            _argocd_rescue_outcome: ""

        - name: Read the checkpoint the failure left
          when: acm_switchover_execution.checkpoint.enabled | default(false)
          block:
            - name: Read checkpoint facts for the failure rescue
              tomazb.acm_switchover.checkpoint_phase:
                read_facts: true
                checkpoint: "{{ acm_switchover_execution.checkpoint | default({}) }}"
              register: _argocd_rescue_checkpoint
          rescue:
            # Unreadable: journal presence is unproven, so the journal rules apply.
            - name: Record the unreadable checkpoint for the failure rescue
              ansible.builtin.set_fact:
                _argocd_rescue_checkpoint:
                  facts:
                    migration_journal_present: true
                    argocd_repause_required:

        # PR C decisions amendment 2.2 and #332 N6: with a migration journal, valid or
        # invalid, the resume needs the durable re-pause marker and every failure is
        # reported; journal-free runs are unchanged.
        - name: Decide whether a migration journal governs the failure rescue
          ansible.builtin.set_fact:
            _acm_rescue_under_journal: >-
              {{
                (acm_switchover_execution.checkpoint.enabled | default(false) | bool)
                and (((_argocd_rescue_checkpoint | default({})).get('facts') or {}).get('migration_journal_present', true) | bool)
              }}

        - name: Attempt Argo CD resume on secondary hub after failure
          ansible.builtin.include_role:
            name: tomazb.acm_switchover.argocd_manage
          vars:
            acm_switchover_argocd_mode_override: resume
            _argocd_discover_hub: secondary
          when:
            - not (_acm_rescue_under_journal | bool)
            - acm_switchover_features.argocd.manage | default(false)
            - acm_switchover_features.argocd.resume_on_failure | default(false)
          ignore_errors: true  # noqa: ignore-errors

        - name: Resume Argo CD under the migration journal after failure
          ansible.builtin.include_role:
            name: tomazb.acm_switchover.argocd_manage
            tasks_from: journal_rescue
          vars:
            _argocd_rescue_hubs:
              - secondary
          when:
            - _acm_rescue_under_journal | bool
            - not (_argocd_repause_failed | default(false) | bool)
            - acm_switchover_features.argocd.manage | default(false)
            - acm_switchover_features.argocd.resume_on_failure | default(false)

        - name: Re-raise original restore-only failure
          ansible.builtin.fail:
            msg: >-
              {{ _acm_restore_only_failure }}{{
                (' ' ~ _argocd_rescue_outcome) if (_argocd_rescue_outcome | default('') | length) > 0 else ''
              }}

      always:
        - name: Build restore-only report contract
          ansible.builtin.set_fact:
            acm_switchover_report:
              schema_version: "1.0"
              source: tomazb.acm_switchover
              operation: restore_only
              argocd:
                run_id: "{{ acm_switchover_argocd.run_id | default(acm_switchover_execution.run_id | default('')) }}"
                summary: >-
                  {%- set hubs = acm_switchover_argocd_summary_by_hub | default({}) -%}
                  {%- if hubs | length > 0 -%}
                  {%- set ns = namespace(paused=0, restored=0) -%}
                  {%- for _hub_name, hub_summary in hubs.items() -%}
                  {%- set ns.paused = ns.paused + (hub_summary.get('paused', 0) | int) -%}
                  {%- set ns.restored = ns.restored + (hub_summary.get('restored', 0) | int) -%}
                  {%- endfor -%}
                  {{ {'paused': ns.paused, 'restored': ns.restored} }}
                  {%- else -%}
                  {{ acm_switchover_argocd_summary | default({}) }}
                  {%- endif -%}
              phases: >-
                {{
                  {}
                  | combine({'activation': acm_switchover_activation_result} if acm_switchover_activation_result is defined else {})
                  | combine({'post_activation': acm_switchover_post_activation_result} if acm_switchover_post_activation_result is defined else {})
                  | combine({'finalization': acm_switchover_finalization_result} if acm_switchover_finalization_result is defined else {})
                }}

        - name: Write restore-only report artifact
          tomazb.acm_switchover.acm_report_artifact:
            path: "{{ (acm_switchover_execution.report_dir | default('./artifacts')) ~ '/restore-only-report.json' }}"
            report: "{{ acm_switchover_report }}"
