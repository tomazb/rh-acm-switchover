---
# R4-04: immediately before any enablement, the journaled Restore cleanup must be terminal
# and a fresh strict read must prove its locator empty; a same-name object inherits no
# evidence and blocks. A preview reads and enables nothing.
- name: Prove the journaled Restore locator empty before enablement
  when: not (_acm_preview | bool)
  block:
    - name: Read the journaled Restore locator before enablement
      ansible.builtin.include_tasks: "{{ role_path }}/../activation/tasks/strict_read.yml"
      vars:
        _acm_read:
          key: "restore/{{ _acm_journal.restore.name }}"
          read_mode: get
          api_version: cluster.open-cluster-management.io/v1beta1
          kind: Restore
          resource_name: restores
          namespace: "{{ _acm_journal.restore.namespace }}"
          name: "{{ _acm_journal.restore.name }}"
        _acm_read_fact: _acm_enable_locator_read
      when: _acm_has_journal | bool

    - name: Require terminal cleanup and the proven-empty locator
      tomazb.acm_switchover.acm_migration_evidence:
        operation: cleanup_locator_absent
        inputs:
          journal: "{{ _acm_journal if (_acm_has_journal | bool) else omit }}"
          live_read: "{{ _acm_enable_locator_read | default({'read_status': 'not_found', 'resources': []}) }}"

- name: Derive secondary ACM version safely
  ansible.builtin.set_fact:
    _acm_secondary_version: >-
      {{
        (
          (acm_finalization_mch_info.resources | default([]) | first | default({}))
          .get('status', {})
          .get('currentVersion', '')
        )
      }}

- name: Plan backup schedule enable operation
  tomazb.acm_switchover.acm_backup_schedule:
    acm_version: "{{ _acm_secondary_version }}"
    intent: enable
    schedules: "{{ acm_finalization_backup_schedules_info.resources | default([]) }}"
    saved_schedule: "{{ acm_switchover_saved_backup_schedule | default({}) }}"
  register: acm_enable_backup_schedule_operation

- name: Patch BackupSchedule to enabled state
  kubernetes.core.k8s:
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
    state: patched
    api_version: cluster.open-cluster-management.io/v1beta1
    kind: BackupSchedule
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace | default('open-cluster-management-backup') }}"
    definition: "{{ acm_enable_backup_schedule_operation.operation.patch }}"
  loop: "{{ acm_finalization_backup_schedules_info.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  register: _enable_backup_patch_results
  when:
    - acm_enable_backup_schedule_operation.operation.action == 'patch'
    - acm_switchover_execution.mode | default('dry_run') == 'execute'

- name: Create BackupSchedule from saved state
  kubernetes.core.k8s:
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
    state: present
    definition: "{{ acm_enable_backup_schedule_operation.operation.body }}"
  register: _enable_backup_create_result
  when:
    - acm_enable_backup_schedule_operation.operation.action == 'create'
    - acm_switchover_execution.mode | default('dry_run') == 'execute'

- name: Refresh BackupSchedule facts after enable or recreation
  kubernetes.core.k8s_info:
    api_version: cluster.open-cluster-management.io/v1beta1
    kind: BackupSchedule
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: _acm_finalization_backup_schedules_refresh_info
  when:
    - acm_enable_backup_schedule_operation.operation.action in ['patch', 'create']
    - acm_switchover_execution.mode | default('dry_run') == 'execute'

- name: Publish refreshed BackupSchedule facts after enable or recreation
  ansible.builtin.set_fact:
    acm_finalization_backup_schedules_info: "{{ _acm_finalization_backup_schedules_refresh_info }}"
  when:
    - _acm_finalization_backup_schedules_refresh_info is defined
    - not (_acm_finalization_backup_schedules_refresh_info.skipped | default(false))

- name: Record backup verification baseline timestamp
  ansible.builtin.set_fact:
    acm_switchover_backup_schedule_enabled_at: >-
      {{
        acm_switchover_backup_schedule_enabled_at
        | default(now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'), true)
      }}
  when: acm_switchover_execution.mode | default('dry_run') == 'execute'

- name: Publish enable backups result
  ansible.builtin.set_fact:
    acm_switchover_enable_backups_result:
      changed: >-
        {{
          (_enable_backup_patch_results.changed | default(false))
          or (_enable_backup_create_result.changed | default(false))
          or (
            (((acm_switchover_execution | default({})).get('mode', 'dry_run') != 'execute') or ansible_check_mode)
            and acm_enable_backup_schedule_operation.operation.action != 'none'
          )
        }}
      operation: "{{ acm_enable_backup_schedule_operation.operation }}"
