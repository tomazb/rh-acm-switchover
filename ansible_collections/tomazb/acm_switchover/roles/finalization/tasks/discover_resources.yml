---
- name: Read finalization BackupSchedules when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: cluster.open-cluster-management.io/v1beta1
    kind: BackupSchedule
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: _acm_finalization_backup_schedules_live_info
  when: acm_finalization_backup_schedules_info is not defined

- name: Publish live finalization BackupSchedule resources
  ansible.builtin.set_fact:
    acm_finalization_backup_schedules_info: "{{ _acm_finalization_backup_schedules_live_info }}"
  when:
    - _acm_finalization_backup_schedules_live_info is defined
    - not (_acm_finalization_backup_schedules_live_info.skipped | default(false))

- name: Refresh finalization MultiClusterHub in execute mode or when not pre-seeded
  kubernetes.core.k8s_info:
    api_version: operator.open-cluster-management.io/v1
    kind: MultiClusterHub
    namespace: open-cluster-management
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: _acm_finalization_mch_live_info
  when: >-
    (acm_switchover_execution.mode | default('dry_run') == 'execute')
    or (acm_finalization_mch_info is not defined)

- name: Publish live finalization MultiClusterHub resources
  ansible.builtin.set_fact:
    acm_finalization_mch_info: "{{ _acm_finalization_mch_live_info }}"
  when:
    - _acm_finalization_mch_live_info is defined
    - not (_acm_finalization_mch_live_info.skipped | default(false))

- name: Read finalization Restore resources when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: cluster.open-cluster-management.io/v1beta1
    kind: Restore
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: _acm_finalization_restores_live_info
  when: acm_finalization_restores_info is not defined

- name: Publish live finalization Restore resources
  ansible.builtin.set_fact:
    acm_finalization_restores_info: "{{ _acm_finalization_restores_live_info }}"
  when:
    - _acm_finalization_restores_live_info is defined
    - not (_acm_finalization_restores_live_info.skipped | default(false))

- name: Seed empty old-hub passive restore info in dry-run mode
  ansible.builtin.set_fact:
    _old_hub_existing_restore_info:
      resources: []
  when:
    - _old_hub_existing_restore_info is not defined
    - acm_switchover_execution.mode | default('dry_run') == 'dry_run'
    - (acm_switchover_operation.old_hub_action | default('secondary')) == 'secondary'
    - not (acm_switchover_operation.restore_only | default(false))

- name: Read existing passive sync restore on old hub when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: cluster.open-cluster-management.io/v1beta1
    kind: Restore
    name: restore-acm-passive-sync
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: _old_hub_existing_restore_info
  when:
    - _old_hub_existing_restore_info is not defined
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
    - (acm_switchover_operation.old_hub_action | default('secondary')) == 'secondary'
    - not (acm_switchover_operation.restore_only | default(false))
