---
- name: Clear active Backup verification decision for this invocation
  ansible.builtin.set_fact:
    acm_switchover_backup_verification_skipped: false

- name: Skip backup continuity verification in dry-run mode
  ansible.builtin.set_fact:
    acm_switchover_backup_verification_skipped: true
    acm_switchover_verify_backups_result:
      changed: false
      status: skipped
      reason: "{{ acm_switchover_execution.mode | default('dry_run') }}"
  when: acm_switchover_execution.mode | default('dry_run') != 'execute'

- name: Skip backup continuity verification when restore_only has no BackupSchedule
  ansible.builtin.set_fact:
    acm_switchover_backup_verification_skipped: true
    acm_switchover_verify_backups_result:
      changed: false
      status: skipped
      reason: restore_only_no_backup_schedule
      message: >-
        Restore-only mode does not recreate BackupSchedule automatically when none
        was present to restore. Create it manually after finalization.
  when:
    - acm_switchover_execution.mode | default('dry_run') == 'execute'
    - acm_switchover_operation.restore_only | default(false)
    - (acm_finalization_backup_schedules_info.resources | default([]) | length) == 0
    - acm_enable_backup_schedule_operation.operation.action == 'none'

- name: Wait for a fresh ACM-owned backup on the secondary hub
  ansible.builtin.set_fact:
    _acm_secondary_backup_verify_timeout_seconds: >-
      {%- set cron_expr =
        ((acm_finalization_backup_schedules_info.resources | default([]) | first | default({}))
        .get('spec', {})
        .get('veleroSchedule', ''))
      -%}
      {%- if cron_expr is match('^\\*/[0-9]+ \\* \\* \\* \\*$') -%}
      {{ [600, ((cron_expr | regex_replace('^\*/([0-9]+) \* \* \* \*$', '\1') | int) * 60 + 600)] | max }}
      {%- elif cron_expr is match('^[0-9]+ \\*/[0-9]+ \\* \\* \\*$') -%}
      {{ [600, ((cron_expr | regex_replace('^[0-9]+ \*/([0-9]+) \* \* \*$', '\1') | int) * 3600 + 600)] | max }}
      {%- elif cron_expr is match('^[0-9]+ [0-9]+ \\*/[0-9]+ \\* \\*$') -%}
      {{ [600, ((cron_expr | regex_replace('^[0-9]+ [0-9]+ \*/([0-9]+) \* \*$', '\1') | int) * 86400 + 600)] | max }}
      {%- elif cron_expr is match('^[0-9]+ [0-9]+ \\* \\* \\*$') -%}
      87000
      {%- elif cron_expr is match('^[0-9]+ [0-9]+ \\* \\* [0-9]+$') -%}
      605400
      {%- elif cron_expr is match('^[0-9]+ [0-9]+ [0-9]+ \\* \\*$') -%}
      2592600
      {%- else -%}
      600
      {%- endif -%}
  when:
    - acm_switchover_execution.mode | default('dry_run') == 'execute'
    - not (acm_switchover_backup_verification_skipped | bool)

- name: Prove fresh ACM-owned Backup creation and clean completion
  tomazb.acm_switchover.acm_backup_continuity:
    inputs:
      enabled_at_present: true
      enabled_at: "{{ acm_switchover_backup_schedule_enabled_at }}"
    timeout: "{{ _acm_secondary_backup_verify_timeout_seconds | int }}"
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: acm_switchover_active_backup_proof
  when:
    - acm_switchover_execution.mode | default('dry_run') == 'execute'
    - not (acm_switchover_backup_verification_skipped | bool)

- name: Publish backup verification result
  ansible.builtin.set_fact:
    acm_switchover_verify_backups_result:
      changed: false
      status: pass
      enabled_at: "{{ acm_switchover_backup_schedule_enabled_at }}"
      backup_count: 1
      backup_name: "{{ acm_switchover_active_backup_proof.proof.name }}"
      backup_phase: "{{ acm_switchover_active_backup_proof.proof.phase }}"
  when:
    - acm_switchover_execution.mode | default('dry_run') == 'execute'
    - not (acm_switchover_backup_verification_skipped | bool)
