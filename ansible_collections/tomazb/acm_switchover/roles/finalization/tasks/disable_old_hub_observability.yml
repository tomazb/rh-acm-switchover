---
# The secondary-disposition adapter for the old hub's Observability teardown.
#
# It owns NO MultiClusterObservability logic of its own: no read, no delete, no drain
# wait. It delegates to the ONE shared teardown task -- the same phase machine, the
# same UID-preconditioned guarded delete, the same destination-observability gate --
# and republishes that task's outcome under the name finalization/main.yml consumes.
# This is the collection's mirror of Finalization reaching Decommission.teardown_observability().
#
# It deliberately does NOT include decommission/tasks/main.yml: that file owns the
# standalone confirmation gate, the substep dispatch, the summary artifact and the
# validate-mode refusal, none of which belong inside a finalization phase this role
# has already entered. `include_role` with `tasks_from` is what makes the decommission
# role's defaults (including acknowledge_observability_not_migrated) available without
# running its entry point. The acknowledgement is NOT valid for old_hub_action=secondary
# and this adapter passes none: validation refuses it outside old_hub_action=decommission.

- name: Initialize old hub observability disable result
  ansible.builtin.set_fact:
    acm_switchover_disable_old_hub_observability_result:
      changed: false
      deleted_mcos: []
      status: pass

- name: Announce old hub MCO deletion (dry_run)
  ansible.builtin.debug:
    msg: >-
      [dry_run] Would delete MultiClusterObservability on the old hub and wait
      for observability pods to terminate.
  when: acm_switchover_execution.mode | default('dry_run') == 'dry_run'

# The shared teardown persists its phase records BEFORE it deletes, and its writers
# refuse without a durable identity map. Saying so here turns an opaque mid-teardown
# refusal into a configuration error raised before anything is read or deleted.
- name: Require durable checkpoint state before the old hub observability teardown
  ansible.builtin.assert:
    that:
      # Validate is REFUSED here for the same reason decommission/tasks/main.yml
      # refuses it: the shared teardown's delete guards fire in any mode other than
      # dry_run, while checkpoint_phase treats validate as non-mutating and records no
      # phase, so a validate run would really delete the old hub's
      # MultiClusterObservability and leave no durable identity map behind.
      - (acm_switchover_execution.mode | default('dry_run')) != 'validate'
      - acm_switchover_execution.checkpoint.enabled | default(false) | bool
    fail_msg: >-
      {{
        _acm_adapter_validate_refusal
        if (acm_switchover_execution.mode | default('dry_run')) == 'validate'
        else _acm_adapter_checkpoint_refusal
      }}
  vars:
    _acm_adapter_validate_refusal: >-
      Refusing to tear down old hub Observability in validate mode: this teardown has
      no non-mutating validate path. Its delete guards fire in any mode other than
      dry_run, so a validate run would really delete MultiClusterObservability while
      the checkpoint action records no phase at all. Preview with
      acm_switchover_execution.mode set to dry_run, or run for real with
      acm_switchover_execution.mode set to execute and
      acm_switchover_execution.checkpoint.enabled set to true.
    _acm_adapter_checkpoint_refusal: >-
      Refusing to tear down old hub Observability in execute mode without durable
      checkpoint state: the MultiClusterObservability identity map must be persisted
      before the delete. Set acm_switchover_execution.checkpoint.enabled to true
      (with backend file and a writable path), or preview with
      acm_switchover_execution.mode set to dry_run.
  when:
    - not ansible_check_mode
    - (acm_switchover_execution.mode | default('dry_run')) in ['execute', 'validate']

# Exactly what decommission/tasks/main.yml seeds for the same task, and nothing more:
# the shared teardown reads `_acm_decommission_records_outcomes` and combines into
# `acm_switchover_decommission_outcomes`. A preview records no outcome at all.
- name: Initialize the shared teardown's outcome recording
  ansible.builtin.set_fact:
    acm_switchover_decommission_outcomes: {}
    _acm_decommission_records_outcomes: >-
      {{
        (not ansible_check_mode)
        and (acm_switchover_execution.mode | default('dry_run') != 'dry_run')
      }}

- name: Delete the old hub MultiClusterObservability through the shared teardown
  ansible.builtin.include_role:
    name: tomazb.acm_switchover.decommission
    tasks_from: delete_observability.yml
  vars:
    # Mirrors Python's `record_gitops_markers=True` on the finalization call site: the
    # shared task warns about declaratively managed objects before it deletes them.
    _acm_mco_warn_gitops: true

- name: Publish old hub observability disable result
  ansible.builtin.set_fact:
    acm_switchover_disable_old_hub_observability_result:
      changed: "{{ _acm_mco_changed | default(false) | bool }}"
      deleted_mcos: "{{ ['observability'] if (_acm_mco_changed | default(false) | bool) else [] }}"
      status: "{{ 'skipped' if acm_switchover_execution.mode | default('dry_run') == 'dry_run' else 'pass' }}"
