---
# R4-04: immediately before any write that leaves an enabled BackupSchedule (enablement, the
# collision rescue's restoration), the journaled Restore cleanup must be terminal and a fresh
# strict read must prove its locator empty. Collision repair proves it immediately before its
# DELETE, then waits for the deletion and recreates without a second read, so a failed read can
# never leave the hub without a BackupSchedule. A proof establishes absence only at the instant
# of the read (design J); it reserves nothing. A same-name object inherits no evidence and
# blocks. Callers include this only outside a preview.

- name: Read the journaled Restore locator before a BackupSchedule write
  ansible.builtin.include_tasks: "{{ role_path }}/../activation/tasks/strict_read.yml"
  vars:
    _acm_read:
      key: "restore/{{ _acm_journal.restore.name }}"
      read_mode: get
      api_version: cluster.open-cluster-management.io/v1beta1
      kind: Restore
      resource_name: restores
      namespace: "{{ _acm_journal.restore.namespace }}"
      name: "{{ _acm_journal.restore.name }}"
    _acm_read_fact: _acm_enable_locator_read
  when: _acm_has_journal | bool

- name: Require terminal cleanup and the proven-empty locator
  tomazb.acm_switchover.acm_migration_evidence:
    operation: cleanup_locator_absent
    inputs:
      journal: "{{ _acm_journal if (_acm_has_journal | bool) else omit }}"
      live_read: "{{ _acm_enable_locator_read | default({'read_status': 'not_found', 'resources': []}) }}"
