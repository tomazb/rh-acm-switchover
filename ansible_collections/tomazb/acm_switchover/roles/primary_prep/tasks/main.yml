---
- name: Enter checkpointed phase
  tomazb.acm_switchover.checkpoint_phase:
    phase: primary_prep
    checkpoint: "{{ acm_switchover_execution.checkpoint | default({}) }}"
    status: enter
  register: _checkpoint_enter
  when: acm_switchover_execution.checkpoint.enabled | default(false)

- name: Run primary_prep phase
  when: not ((_checkpoint_enter | default({})).skipped_phase | default(false))
  block:
    - name: Discover primary hub resources
      ansible.builtin.include_tasks: discover_resources.yml

    - name: Rehydrate Argo CD run_id from checkpoint before pause
      ansible.builtin.set_fact:
        acm_switchover_argocd: >-
          {{
            acm_switchover_argocd | default({})
            | combine({
                'run_id': ((((_checkpoint_enter | default({})) or {}).get('checkpoint', {}) or {})
                  .get('operational_data', {})
                  .get('argocd_run_id'))
              })
          }}
      when:
        - acm_switchover_features.argocd.manage | default(false)
        - acm_switchover_execution.checkpoint.enabled | default(false)
        - (acm_switchover_argocd.run_id | default('')) | length == 0
        - ((((_checkpoint_enter | default({})) or {}).get('checkpoint', {}) or {}).get('operational_data', {}).get('argocd_run_id', '') | length) > 0

    - name: Validate rehydrated Argo CD discovery namespaces from checkpoint
      ansible.builtin.assert:
        that:
          - item.value is list
        fail_msg: >-
          Checkpoint operational_data.argocd_discovery_namespaces.{{ item.key }}
          must be a list of namespace names.
      loop: >-
        {{
          (((_checkpoint_enter | default({})) or {}).get('checkpoint', {}) or {})
          .get('operational_data', {})
          .get('argocd_discovery_namespaces', {})
          | dict2items
        }}
      when:
        - acm_switchover_features.argocd.manage | default(false)
        - acm_switchover_execution.checkpoint.enabled | default(false)
        - ((((_checkpoint_enter | default({})) or {}).get('checkpoint', {}) or {}).get('operational_data', {}).get('argocd_discovery_namespaces')) is mapping
        - ((((_checkpoint_enter | default({})) or {}).get('checkpoint', {}) or {}).get('operational_data', {}).get('argocd_discovery_namespaces', {}) | length) > 0

    - name: Rehydrate Argo CD discovery namespaces from checkpoint before pause
      ansible.builtin.set_fact:
        acm_switchover_argocd_discovery_namespaces: >-
          {{
            (((_checkpoint_enter | default({})) or {}).get('checkpoint', {}) or {})
            .get('operational_data', {})
            .get('argocd_discovery_namespaces', {})
          }}
      when:
        - acm_switchover_features.argocd.manage | default(false)
        - acm_switchover_execution.checkpoint.enabled | default(false)
        - (acm_switchover_argocd_discovery_namespaces | default({}) | length) == 0
        - ((((_checkpoint_enter | default({})) or {}).get('checkpoint', {}) or {}).get('operational_data', {}).get('argocd_discovery_namespaces')) is mapping
        - ((((_checkpoint_enter | default({})) or {}).get('checkpoint', {}) or {}).get('operational_data', {}).get('argocd_discovery_namespaces', {}) | length) > 0

    - name: Pause Argo CD auto-sync on primary hub when enabled
      ansible.builtin.include_role:
        name: tomazb.acm_switchover.argocd_manage
      vars:
        acm_switchover_argocd_mode_override: pause
        _argocd_discover_hub: primary
      when: acm_switchover_features.argocd.manage | default(false)

    - name: Pause Argo CD auto-sync on secondary hub when enabled
      ansible.builtin.include_role:
        name: tomazb.acm_switchover.argocd_manage
      vars:
        acm_switchover_argocd_mode_override: pause
        _argocd_discover_hub: secondary
      when:
        - acm_switchover_features.argocd.manage | default(false)
        - acm_switchover_hubs.secondary is defined

    - name: Pause BackupSchedule on primary hub
      ansible.builtin.include_tasks: pause_backups.yml

    - name: Manage import-controller strategy and disable-auto-import markers
      ansible.builtin.include_tasks: manage_auto_import.yml

    - name: Scale observability components when enabled
      ansible.builtin.include_tasks: scale_observability.yml
      when: acm_switchover_primary_has_observability | default(false) | bool

    - name: Publish primary_prep result contract
      ansible.builtin.set_fact:
        acm_switchover_primary_prep_result:
          phase: primary_prep
          status: pass
          changed: >-
            {{
              (acm_switchover_pause_backups_result.changed | default(false))
              or (acm_switchover_auto_import_result.changed | default(false))
              or (acm_switchover_observability_scale_result.changed | default(false))
            }}
  rescue:
    - name: Mark checkpoint failure
      tomazb.acm_switchover.checkpoint_phase:
        phase: primary_prep
        checkpoint: "{{ acm_switchover_execution.checkpoint | default({}) }}"
        status: fail
        error: "{{ ansible_failed_result.msg | default('unknown failure') }}"
        operational_data:
          argocd_run_id: "{{ acm_switchover_argocd.run_id | default(acm_switchover_execution.run_id | default('')) }}"
          argocd_discovery_namespaces: "{{ acm_switchover_argocd_discovery_namespaces | default({}) }}"
          saved_backup_schedule: "{{ acm_switchover_saved_backup_schedule | default('') }}"
      when: acm_switchover_execution.checkpoint.enabled | default(false)

    - name: Re-raise failure
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('Phase primary_prep failed') }}"

- name: Mark checkpoint phase completion
  # No file artifact for primary_prep; report_ref not applicable
  tomazb.acm_switchover.checkpoint_phase:
    phase: primary_prep
    checkpoint: "{{ acm_switchover_execution.checkpoint | default({}) }}"
    status: pass
    operational_data:
      argocd_run_id: "{{ acm_switchover_argocd.run_id | default(acm_switchover_execution.run_id | default('')) }}"
      argocd_discovery_namespaces: "{{ acm_switchover_argocd_discovery_namespaces | default({}) }}"
      saved_backup_schedule: "{{ acm_switchover_saved_backup_schedule | default('') }}"
  when:
    - acm_switchover_execution.checkpoint.enabled | default(false)
    - not ((_checkpoint_enter | default({})).skipped_phase | default(false))
