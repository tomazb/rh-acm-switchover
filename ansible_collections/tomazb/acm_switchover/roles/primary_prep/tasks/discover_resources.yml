---
- name: Read primary MultiClusterHub when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: operator.open-cluster-management.io/v1
    kind: MultiClusterHub
    namespace: open-cluster-management
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: _acm_primary_prep_mch_live_info
  when: acm_primary_prep_mch_info is not defined

- name: Publish live primary MultiClusterHub resources for primary_prep
  ansible.builtin.set_fact:
    acm_primary_prep_mch_info: "{{ _acm_primary_prep_mch_live_info }}"
  when:
    - _acm_primary_prep_mch_live_info is defined
    - not (_acm_primary_prep_mch_live_info.skipped | default(false))

- name: Read primary BackupSchedules when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: cluster.open-cluster-management.io/v1beta1
    kind: BackupSchedule
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: _acm_primary_prep_backup_schedules_live_info
  when: acm_primary_prep_backup_schedules_info is not defined

- name: Publish live primary BackupSchedule resources for primary_prep
  ansible.builtin.set_fact:
    acm_primary_prep_backup_schedules_info: "{{ _acm_primary_prep_backup_schedules_live_info }}"
  when:
    - _acm_primary_prep_backup_schedules_live_info is defined
    - not (_acm_primary_prep_backup_schedules_live_info.skipped | default(false))

- name: Read primary hub Thanos compactor StatefulSet when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: open-cluster-management-observability
    label_selectors:
      - "app.kubernetes.io/name=thanos-compact"
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: acm_primary_compactor_info
  when:
    - acm_primary_compactor_info is not defined
    - not (acm_switchover_features.skip_observability_checks | default(false) | bool)
