---
- name: Derive primary ACM version safely
  ansible.builtin.set_fact:
    _acm_primary_version: >-
      {{
        (
          (acm_primary_prep_mch_info.resources | default([]) | first | default({}))
          .get('status', {})
          .get('currentVersion', '')
        )
      }}

- name: Plan BackupSchedule pause operation
  tomazb.acm_switchover.acm_backup_schedule:
    acm_version: "{{ _acm_primary_version }}"
    intent: pause
    schedules: "{{ acm_primary_prep_backup_schedules_info.resources | default([]) }}"
  register: acm_backup_schedule_operation

- name: Persist reusable BackupSchedule body before pause/delete
  ansible.builtin.set_fact:
    acm_switchover_saved_backup_schedule:
      apiVersion: cluster.open-cluster-management.io/v1beta1
      kind: BackupSchedule
      metadata:
        name: "{{ ((acm_primary_prep_backup_schedules_info.resources | default([]) | first | default({})).get('metadata', {})).get('name', '') }}"
        namespace: "{{ ((acm_primary_prep_backup_schedules_info.resources | default([]) | first | default({})).get('metadata', {})).get('namespace', 'open-cluster-management-backup') }}"
        labels: "{{ ((acm_primary_prep_backup_schedules_info.resources | default([]) | first | default({})).get('metadata', {})).get('labels', {}) }}"
        annotations: "{{ ((acm_primary_prep_backup_schedules_info.resources | default([]) | first | default({})).get('metadata', {})).get('annotations', {}) }}"
      spec: "{{ (acm_primary_prep_backup_schedules_info.resources | default([]) | first | default({})).get('spec', {}) }}"
  when: (acm_primary_prep_backup_schedules_info.resources | default([]) | length) > 0

- name: Patch BackupSchedule to paused state
  kubernetes.core.k8s:
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
    state: patched
    api_version: cluster.open-cluster-management.io/v1beta1
    kind: BackupSchedule
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace | default('open-cluster-management-backup') }}"
    definition: "{{ acm_backup_schedule_operation.operation.patch }}"
  loop: "{{ acm_primary_prep_backup_schedules_info.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  register: _backup_patch_results
  when:
    - acm_backup_schedule_operation.operation.action == 'patch'
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'

- name: Delete BackupSchedule for ACM 2.11 pause
  when:
    - acm_backup_schedule_operation.operation.action == 'delete'
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
  block:
    - name: Delete BackupSchedule resource for ACM 2.11 pause
      kubernetes.core.k8s:
        kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
        context: "{{ acm_switchover_hubs.primary.context }}"
        state: absent
        api_version: cluster.open-cluster-management.io/v1beta1
        kind: BackupSchedule
        name: "{{ item.metadata.name }}"
        namespace: "{{ item.metadata.namespace | default('open-cluster-management-backup') }}"
      loop: "{{ acm_primary_prep_backup_schedules_info.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      register: _backup_delete_results
  rescue:
    - name: Capture BackupSchedule pause delete failure
      ansible.builtin.set_fact:
        _backup_schedule_pause_delete_failure: "{{ ansible_failed_result }}"

    - name: Restore BackupSchedule after failed ACM 2.11 pause delete
      block:
        - name: Restore BackupSchedule from saved body after failed pause delete
          kubernetes.core.k8s:
            kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
            context: "{{ acm_switchover_hubs.primary.context }}"
            state: present
            definition: "{{ acm_switchover_saved_backup_schedule }}"
          register: _backup_schedule_pause_delete_restore
      rescue:
        - name: Fail after BackupSchedule pause delete and restore failure
          ansible.builtin.fail:
            msg: >-
              BackupSchedule pause delete failed and restore from saved body also
              failed. Original delete error:
              {{ _backup_schedule_pause_delete_failure.msg | default('unknown delete failure') }}.
              Restore error: {{ ansible_failed_result.msg | default('unknown restore failure') }}.
              Saved schedule name:
              {{ acm_switchover_saved_backup_schedule.metadata.name | default('unknown') }}.

    - name: Fail after BackupSchedule pause delete failure
      ansible.builtin.fail:
        msg: >-
          BackupSchedule pause delete failed. Restore from the saved
          BackupSchedule body completed; rerun after resolving the delete
          failure. Original delete error:
          {{ _backup_schedule_pause_delete_failure.msg | default('unknown delete failure') }}.
          Restore result: {{ _backup_schedule_pause_delete_restore | default({}) }}.

- name: Publish backup schedule result
  ansible.builtin.set_fact:
    acm_switchover_pause_backups_result:
      changed: >-
        {{
          (_backup_patch_results.changed | default(false))
          or (_backup_delete_results.changed | default(false))
          or ((((acm_switchover_execution | default({})).get('mode', 'dry_run') == 'dry_run') or ansible_check_mode)
              and acm_backup_schedule_operation.operation.action != 'none')
        }}
      operation: "{{ acm_backup_schedule_operation.operation }}"
