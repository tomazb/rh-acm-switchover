---
- name: Initialize observability scale result
  ansible.builtin.set_fact:
    acm_switchover_observability_scale_result:
      changed: false
      scaled: false

- name: Fail when Observability was detected but thanos-compactor is missing
  ansible.builtin.fail:
    msg: >-
      Thanos compactor StatefulSet was not found in
      open-cluster-management-observability after Observability was detected.
      Set acm_switchover_features.skip_observability_checks=true only when
      Observability will be handled separately.
  when:
    - (acm_primary_compactor_info.resources | default([]) | length) == 0
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'

- name: Scale thanos-compactor when a fixture or discovery result provides it
  kubernetes.core.k8s_scale:
    api_version: apps/v1
    kind: StatefulSet
    name: "{{ acm_primary_compactor_info.resources[0].metadata.name }}"
    namespace: open-cluster-management-observability
    replicas: 0
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: acm_primary_compactor_scale
  when:
    - (acm_primary_compactor_info.resources | default([]) | length) > 0
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'

- name: Read thanos-compactor pods after scale-down
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: open-cluster-management-observability
    label_selectors:
      - "app.kubernetes.io/name=thanos-compact"
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: acm_primary_compactor_pods_after_scale
  until: (acm_primary_compactor_pods_after_scale.resources | default([]) | length) == 0
  retries: 30
  delay: 10
  failed_when: false
  when:
    - (acm_primary_compactor_info.resources | default([]) | length) > 0
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
    - acm_primary_compactor_scale is defined

- name: Fail when thanos-compactor pods remain after scale-down
  ansible.builtin.fail:
    msg: >-
      {% if acm_primary_compactor_pods_after_scale is failed %}
      Failed to verify Thanos compactor pod termination after scale-down:
      {{ acm_primary_compactor_pods_after_scale.msg | default('pod query failed') }}
      {% else %}
      Thanos compactor still has
      {{ acm_primary_compactor_pods_after_scale.resources | default([]) | length }}
      pod(s) running after scale-down
      {% endif %}
  when:
    - (acm_primary_compactor_info.resources | default([]) | length) > 0
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
    - acm_primary_compactor_scale is defined
    - acm_primary_compactor_pods_after_scale is defined
    - >-
      acm_primary_compactor_pods_after_scale is failed
      or (acm_primary_compactor_pods_after_scale.resources | default([]) | length) > 0

- name: Publish observability scale result
  ansible.builtin.set_fact:
    acm_switchover_observability_scale_result:
      changed: "{{ acm_primary_compactor_scale.changed | default(false) }}"
      scaled: "{{ (acm_primary_compactor_info.resources | default([]) | length) > 0 }}"
