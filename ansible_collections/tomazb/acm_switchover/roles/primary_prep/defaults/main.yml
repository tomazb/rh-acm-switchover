---
acm_switchover_hubs:
  primary:
    context: ""
    kubeconfig: ""
  secondary:
    context: ""
    kubeconfig: ""

acm_switchover_execution:
  mode: execute
  verbose: false
  force: false
  report_dir: ./artifacts
  # Opt-in resume: enabling checkpointing adds resumable execution with
  # hub-identity binding. Safety obligations that must survive interruption
  # (Argo CD pause register, auto-import reset marker) live on the cluster
  # and do NOT depend on this setting — see docs/coexistence.md.
  checkpoint:
    enabled: false
    backend: file
    path: .state/switchover.json
    reset: false
    reset_from: ""

acm_switchover_features:
  manage_auto_import_strategy: false
  skip_observability_checks: false
  skip_gitops_check: false
  skip_rbac_validation: false
  disable_observability_on_secondary: false
  argocd:
    manage: false
