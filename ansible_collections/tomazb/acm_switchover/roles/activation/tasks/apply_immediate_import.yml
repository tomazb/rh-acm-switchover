---
# Mirrors Python _apply_immediate_import_annotations() in modules/activation.py.
# When autoImportStrategy is ImportOnly (ACM 2.14+ default), apply the
# immediate-import annotation to each non-local ManagedCluster so the
# import controller processes them without waiting for the next sync.
- name: Skip immediate-import annotation management in dry-run mode
  ansible.builtin.set_fact:
    _apply_immediate_import: false
    acm_switchover_immediate_import_result:
      changed: false
      mode: "{{ acm_switchover_operation.activation_method | default('patch') }}"
      skipped: true
      reason: dry_run
  when: acm_switchover_execution.mode | default('dry_run') == 'dry_run'

- name: Publish immediate import skip result for older ACM versions
  ansible.builtin.set_fact:
    _apply_immediate_import: false
    acm_switchover_immediate_import_result:
      changed: false
      mode: "{{ acm_switchover_operation.activation_method | default('patch') }}"
      skipped: true
      reason: "ACM {{ _acm_secondary_version | default('unknown') }} does not support immediate-import annotations"
  when:
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
    - not (_acm_secondary_supports_auto_import | bool)

- name: Get current autoImportStrategy
  tomazb.acm_switchover.acm_k8s_read_outcome:
    read_mode: get
    api_version: v1
    kind: ConfigMap
    name: import-controller-config
    namespace: multicluster-engine
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: _import_cm_for_annotation
  no_log: true
  when:
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
    - _acm_secondary_supports_auto_import | bool

- name: Validate autoImportStrategy ConfigMap evidence
  ansible.builtin.set_fact:
    _import_cm_for_annotation_valid: >-
      {{
        _import_cm_for_annotation is mapping
        and _import_cm_for_annotation.read_status is defined
        and _import_cm_for_annotation.read_status == 'ok'
        and _import_cm_for_annotation.resources is defined
        and (_import_cm_for_annotation.resources | type_debug) == 'list'
        and (_import_cm_for_annotation.resources | length) == 1
        and _import_cm_for_annotation.resources[0] is mapping
        and _import_cm_for_annotation.resources[0].apiVersion | default('') == 'v1'
        and _import_cm_for_annotation.resources[0].kind | default('') == 'ConfigMap'
        and _import_cm_for_annotation.resources[0].metadata is mapping
        and _import_cm_for_annotation.resources[0].metadata.name | default('') == 'import-controller-config'
        and _import_cm_for_annotation.resources[0].metadata.namespace | default('') == 'multicluster-engine'
        and (
          _import_cm_for_annotation.resources[0].data is not defined
          or _import_cm_for_annotation.resources[0].data == none
          or _import_cm_for_annotation.resources[0].data is mapping
        )
      }}
  when:
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
    - _acm_secondary_supports_auto_import | bool

- name: Fail when autoImportStrategy cannot be verified
  ansible.builtin.fail:
    msg: >-
      Unable to verify autoImportStrategy on the destination hub;
      verify API access and retry.
  when:
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
    - _acm_secondary_supports_auto_import | bool
    - >-
      _import_cm_for_annotation.read_status is not defined
      or (
        _import_cm_for_annotation.read_status != 'not_found'
        and not (_import_cm_for_annotation_valid | default(false) | bool)
      )

- name: Determine if immediate-import annotations are needed
  ansible.builtin.set_fact:
    _apply_immediate_import: >-
      {{
        _import_cm_for_annotation.read_status == 'not_found'
        or (
          (_import_cm_for_annotation.resources[0].data | default({}, true))
          .get('autoImportStrategy', 'ImportOnly')
          in ['ImportOnly', 'default', '']
        )
      }}
  when:
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
    - _acm_secondary_supports_auto_import | bool

- name: Get ManagedClusters on secondary hub
  kubernetes.core.k8s_info:
    api_version: cluster.open-cluster-management.io/v1
    kind: ManagedCluster
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: _mc_for_import
  when:
    - _apply_immediate_import | default(false) | bool
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
    - _acm_secondary_supports_auto_import | bool

- name: Clear stale non-empty immediate-import annotations on non-local clusters
  kubernetes.core.k8s:
    api_version: cluster.open-cluster-management.io/v1
    kind: ManagedCluster
    name: "{{ item.metadata.name }}"
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
    state: patched
    definition:
      metadata:
        annotations:
          import.open-cluster-management.io/immediate-import: null
  loop: >-
    {{ (_mc_for_import.resources | default([]))
       | rejectattr('metadata.name', 'equalto', 'local-cluster')
       | list }}
  loop_control:
    label: "{{ item.metadata.name }}"
  register: acm_clear_immediate_import_results
  when:
    - _apply_immediate_import | default(false) | bool
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
    - _acm_secondary_supports_auto_import | bool
    - not ansible_check_mode
    - (item.metadata.annotations | default({})).get('import.open-cluster-management.io/immediate-import', '') | length > 0

- name: Apply immediate-import annotation to non-local clusters
  kubernetes.core.k8s:
    api_version: cluster.open-cluster-management.io/v1
    kind: ManagedCluster
    name: "{{ item.metadata.name }}"
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
    state: patched
    definition:
      metadata:
        annotations:
          import.open-cluster-management.io/immediate-import: ""
  loop: >-
    {{ (_mc_for_import.resources | default([]))
       | rejectattr('metadata.name', 'equalto', 'local-cluster')
       | list }}
  loop_control:
    label: "{{ item.metadata.name }}"
  register: acm_apply_immediate_import_results
  when:
    - _apply_immediate_import | default(false) | bool
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
    - _acm_secondary_supports_auto_import | bool
    - not ansible_check_mode

- name: Publish immediate import result
  ansible.builtin.set_fact:
    acm_switchover_immediate_import_result:
      changed: >-
        {{
          (acm_clear_immediate_import_results.changed | default(false))
          or (acm_apply_immediate_import_results.changed | default(false))
        }}
      mode: "{{ acm_switchover_operation.activation_method | default('patch') }}"
  when:
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
    - _acm_secondary_supports_auto_import | bool
