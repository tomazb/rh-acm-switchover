---
# R4-04 completion evidence, the collection mirror of
# SecondaryActivation._wait_for_restore_completion. The wait polls strict reads of the
# journaled Restore and the complete Velero Restore list until the method-specific proof
# holds; the ManagedCluster check follows; a fresh proof taken after it is recorded in
# two journal writes, restore.completed_at strictly last. A resumed run over completed
# evidence re-runs the proof and never rewrites it. A preview waits for nothing.

- name: Skip the completion wait in a preview
  ansible.builtin.debug:
    msg: "[DRY-RUN] Skipping wait for restore completion"
  when: _acm_preview | bool

- name: Revalidate the recorded completion evidence on resume
  when:
    - not (_acm_preview | bool)
    - _acm_journal.restore.completed_at is not none
  block:
    - name: Read the proof inputs of the completed Restore
      ansible.builtin.include_tasks: read_completion_inputs.yml

    - name: Re-run the completion contract over the recorded evidence
      tomazb.acm_switchover.acm_migration_evidence:
        operation: revalidate_completed
        inputs:
          journal: "{{ _acm_journal }}"
          restore_read: "{{ _acm_completion_restore_read }}"
          velero_read: "{{ _acm_completion_velero_read }}"
          backup_reads: "{{ _acm_backup_reads }}"

- name: Wait for, prove and record the Restore completion evidence
  when:
    - not (_acm_preview | bool)
    - _acm_journal.restore.completed_at is none
  block:
    - name: Start the completion wait
      ansible.builtin.set_fact:
        _acm_completion_state: pending

    - name: Poll the journaled Restore until its completion proof holds
      ansible.builtin.include_tasks: poll_restore_completion.yml
      loop: "{{ _acm_restore_poll_delays | default([0] + [10] * 12 + [30] * 56) }}"
      loop_control:
        loop_var: _acm_poll_delay
      when: _acm_completion_state != 'complete'

    - name: Fail when the Restore never completed
      ansible.builtin.fail:
        msg: >-
          Timeout waiting for restore to complete after
          {{ _acm_restore_poll_delays | default([0] + [10] * 12 + [30] * 56) | sum }}s
          ({{ _acm_completion_poll.detail | default('no completion proof') }})
      when: _acm_completion_state != 'complete'

    - name: Resolve the activation managed-cluster expectation
      ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/resolve_managed_cluster_expectation.yml"
      vars:
        acm_switchover_managed_cluster_expectation_mode: activation_restore_wait

    - name: Resolve the waiver covering the activation name check
      tomazb.acm_switchover.acm_migration_evidence:
        operation: activation_waiver
        inputs:
          journal: "{{ _acm_journal }}"
          requested: >-
            {{
              ((_acm_role_entry_inputs.results | default([])
                | selectattr('id', 'equalto', 'preflight-input-operation') | list | first | default({}))
                .get('details') or {}).get('managed_cluster_expectation_waiver') or omit
            }}
          expected_names: "{{ acm_switchover_resolved_expected_managed_cluster_names | default([]) }}"
      register: _acm_activation_waiver

    - name: Report the journaled activation waiver
      ansible.builtin.debug:
        msg: >-
          Expected ManagedCluster name check waived for activation by {{ _acm_activation_waiver.waiver.actor }}
          ({{ _acm_activation_waiver.waiver.reason }}); the count floor still applies
      when: _acm_activation_waiver.waiver is not none

    - name: Publish the ManagedCluster check inputs
      ansible.builtin.set_fact:
        _acm_mc_check:
          expected_names: "{{ acm_switchover_resolved_expected_managed_cluster_names | default([]) }}"
          min_managed_clusters: "{{ acm_switchover_resolved_min_managed_clusters | int }}"
          enforce: >-
            {{
              (acm_switchover_resolved_expected_managed_cluster_names | default([]) | length) > 0
              and _acm_activation_waiver.waiver is none
            }}
        _acm_mc_state: pending

    - name: Wait for full-restore ManagedCluster resources
      ansible.builtin.include_tasks: poll_managed_clusters.yml
      loop: "{{ _acm_restore_poll_delays | default([0] + [10] * 12 + [30] * 56) }}"
      loop_control:
        loop_var: _acm_poll_delay
      when:
        - acm_switchover_operation.method == 'full'
        - (_acm_mc_check.min_managed_clusters | int) > 0 or (_acm_mc_check.enforce | bool)
        - _acm_mc_state != 'complete'

    - name: Read the ManagedCluster inventory strictly
      ansible.builtin.include_tasks: strict_read.yml
      vars:
        _acm_read:
          key: managedclusters
          read_mode: list
          api_version: cluster.open-cluster-management.io/v1
          kind: ManagedCluster
          resource_name: managedclusters
        _acm_read_fact: _acm_mc_read
      when: _acm_mc_state != 'complete'

    - name: Verify the ManagedCluster resources were restored
      tomazb.acm_switchover.acm_migration_evidence:
        operation: verify_managed_clusters
        inputs:
          mc_read: "{{ _acm_mc_read }}"
          expected_names: "{{ _acm_mc_check.expected_names }}"
          min_managed_clusters: "{{ _acm_mc_check.min_managed_clusters | int }}"
          enforce: "{{ _acm_mc_check.enforce | bool }}"
      when: _acm_mc_state != 'complete'

    # The ManagedCluster wait can take minutes: commit only a proof taken after it.
    - name: Read the proof inputs after the ManagedCluster check
      ansible.builtin.include_tasks: read_completion_inputs.yml

    - name: Prove completion afresh and build the evidence bundle
      tomazb.acm_switchover.acm_migration_evidence:
        operation: completion_bundle
        inputs:
          journal: "{{ _acm_journal }}"
          restore_read: "{{ _acm_completion_restore_read }}"
          velero_read: "{{ _acm_completion_velero_read }}"
          backup_reads: "{{ _acm_backup_reads }}"
          waiver: "{{ _acm_activation_waiver.waiver or omit }}"
      register: _acm_completion_bundle

    - name: Persist the completion evidence bundle
      tomazb.acm_switchover.checkpoint_phase:
        phase: activation
        checkpoint: "{{ acm_switchover_execution.checkpoint | default({}) }}"
        status: update
        operational_data:
          migration_backups: "{{ _acm_completion_bundle.candidate }}"

    - name: Record the completion time last
      tomazb.acm_switchover.acm_migration_evidence:
        operation: complete
        inputs:
          journal: "{{ _acm_completion_bundle.candidate }}"
      register: _acm_completion

    - name: Persist the completion time
      tomazb.acm_switchover.checkpoint_phase:
        phase: activation
        checkpoint: "{{ acm_switchover_execution.checkpoint | default({}) }}"
        status: update
        operational_data:
          migration_backups: "{{ _acm_completion.candidate }}"

    - name: Continue from the completed migration journal
      ansible.builtin.set_fact:
        _acm_journal: "{{ _acm_completion.candidate }}"

- name: Publish restore wait result
  ansible.builtin.set_fact:
    acm_switchover_wait_for_restore_result:
      changed: false
      completed_at: "{{ _acm_journal.restore.completed_at or '' }}"
      velero_restores: "{{ _acm_journal.restore.velero_restores }}"
