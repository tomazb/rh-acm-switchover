---
- name: Derive secondary ACM version for activation auto-import support
  ansible.builtin.set_fact:
    _acm_secondary_version: >-
      {{
        acm_secondary_version
        | default(
            (
              ((acm_activation_mch_info | default({}, true)).resources | default([], true) | first | default({}))
              .get('status', {})
              .get('currentVersion', '')
            ),
            true
          )
      }}

- name: Determine whether secondary ACM supports activation auto-import features
  ansible.builtin.set_fact:
    _acm_secondary_supports_auto_import: >-
      {{
        (_acm_secondary_version | length > 0)
        and (_acm_secondary_version is version('2.14.0', '>='))
      }}
