---
# R4-04: every activation decision starts from strict reads of the destination hub
# (strict_read.yml) and the migration journal checkpoint_phase validated at the enter.

- name: Read the destination MultiClusterHub strictly
  ansible.builtin.include_tasks: strict_read.yml
  vars:
    _acm_read:
      key: multiclusterhubs
      read_mode: list
      api_version: operator.open-cluster-management.io/v1
      kind: MultiClusterHub
      resource_name: multiclusterhubs
      namespace: open-cluster-management
    _acm_read_fact: _acm_activation_mch_read

- name: Resolve the live ACM minor and its pinned controller contract
  tomazb.acm_switchover.acm_migration_evidence:
    operation: acm_minor
    inputs:
      mch_read: "{{ _acm_activation_mch_read }}"
  register: _acm_activation_minor

- name: Publish the activation MultiClusterHub and migration transaction facts
  ansible.builtin.set_fact:
    acm_activation_mch_info:
      resources: "{{ _acm_activation_mch_read.resources }}"
    _acm_mutation_kind: >-
      {{
        'full_restore' if acm_switchover_operation.method == 'full'
        else ('passive_restore' if (acm_switchover_operation.activation_method | default('patch')) == 'restore'
        else 'passive_patch')
      }}
    _acm_preview: >-
      {{ (acm_switchover_execution.mode | default('dry_run')) != 'execute' or ansible_check_mode }}
    _acm_journal: >-
      {{ (((_checkpoint_enter | default({})).get('facts') or {}).get('migration_journal')) }}

- name: Refuse an invalid recorded migration journal
  ansible.builtin.fail:
    msg: >-
      The recorded migration journal is invalid and blocks activation. Repair the checkpoint, or start
      a new migration with the full checkpoint reset (checkpoint.reset).
  when: >-
    (((_checkpoint_enter | default({})).get('facts') or {}).get('migration_journal_outcome', 'absent'))
    not in ['absent', 'valid']
