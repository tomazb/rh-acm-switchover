---
- name: Use activation Restore test override when supplied
  ansible.builtin.debug:
    msg: Using acm_switchover_test_overrides.activation_restores_info
  when: acm_switchover_test_overrides.activation_restores_info is defined

- name: Read live secondary Restore resources for activation
  kubernetes.core.k8s_info:
    api_version: cluster.open-cluster-management.io/v1beta1
    kind: Restore
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: acm_activation_restores_info
  when: acm_switchover_test_overrides.activation_restores_info is not defined

- name: Read secondary MultiClusterHub when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: operator.open-cluster-management.io/v1
    kind: MultiClusterHub
    namespace: open-cluster-management
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: acm_secondary_mch_info
  when: acm_secondary_mch_info is not defined
