---
# The passive sync Restore is discovered from a strictly complete LIST and strictly
# re-read: it must be sync-enabled and activation-ready (SecondaryActivation._verify_passive_sync).

- name: List the destination ACM Restores strictly
  ansible.builtin.include_tasks: strict_read.yml
  vars:
    _acm_read:
      key: restores
      read_mode: list
      api_version: cluster.open-cluster-management.io/v1beta1
      kind: Restore
      resource_name: restores
      namespace: open-cluster-management-backup
    _acm_read_fact: _acm_passive_list_read

- name: Discover the passive sync Restore
  tomazb.acm_switchover.acm_migration_evidence:
    operation: passive_restore
    inputs:
      restores_read: "{{ _acm_passive_list_read }}"
  register: _acm_passive_discovery

- name: Read the discovered passive sync Restore strictly
  ansible.builtin.include_tasks: strict_read.yml
  vars:
    _acm_read:
      key: "restore/{{ _acm_passive_discovery.restore.metadata.name }}"
      read_mode: get
      api_version: cluster.open-cluster-management.io/v1beta1
      kind: Restore
      resource_name: restores
      namespace: open-cluster-management-backup
      name: "{{ _acm_passive_discovery.restore.metadata.name }}"
    _acm_read_fact: _acm_passive_live_read
  when: _acm_passive_discovery.restore is not none

- name: Require an activation-ready passive sync Restore
  tomazb.acm_switchover.acm_migration_evidence:
    operation: verify_passive_sync
    inputs:
      restores_read: "{{ _acm_passive_list_read }}"
      live_read: "{{ _acm_passive_live_read | default({}) }}"
