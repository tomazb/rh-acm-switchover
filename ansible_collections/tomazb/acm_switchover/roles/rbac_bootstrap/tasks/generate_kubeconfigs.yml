---
- name: Determine RBAC bootstrap kubeconfig settings
  ansible.builtin.set_fact:
    _rbac_bootstrap_namespace: acm-switchover
    _rbac_bootstrap_context_slug: >-
      {{
        (acm_switchover_hubs.primary.context | default('primary', true))
        | regex_replace('[^A-Za-z0-9._-]', '_')
      }}
    _rbac_bootstrap_output_dir: "{{ acm_switchover_rbac_bootstrap.output_dir | default('./kubeconfigs') }}"
    _rbac_bootstrap_script: "{{ role_path }}/files/scripts/generate-sa-kubeconfig.sh"

- name: Determine RBAC bootstrap kubeconfig targets
  ansible.builtin.set_fact:
    _rbac_bootstrap_kubeconfig_targets: >-
      {%- set targets = [] -%}
      {%- for role in _rbac_plan.role_targets | default([acm_switchover_rbac_bootstrap.role]) -%}
        {%- set service_account_name = 'acm-switchover-operator' if role == 'operator' else 'acm-switchover-validator' -%}
        {%- set output_path = (_rbac_bootstrap_output_dir, _rbac_bootstrap_context_slug ~ '-' ~ role ~ '.yaml') | path_join -%}
        {%- set _ = targets.append({
          'role': role,
          'service_account_name': service_account_name,
          'path': output_path,
          'user_name': _rbac_bootstrap_context_slug ~ '-' ~ role
        }) -%}
      {%- endfor -%}
      {{ targets }}

- name: Validate generated kubeconfig output paths
  tomazb.acm_switchover.acm_safe_path_validate:
    path: "{{ item.path }}"
    path_type: artifact
  loop: "{{ _rbac_bootstrap_kubeconfig_targets }}"
  loop_control:
    label: "{{ item.role }}"

- name: Announce kubeconfig generation (dry_run)
  ansible.builtin.debug:
    msg: >-
      [dry_run] Would run {{ _rbac_bootstrap_script }} for
      {{ _rbac_bootstrap_namespace }}/{{ item.service_account_name }}
      and write {{ item.path }}
  loop: "{{ _rbac_bootstrap_kubeconfig_targets }}"
  loop_control:
    label: "{{ item.role }}"
  when: acm_switchover_execution.mode | default('dry_run') == 'dry_run'

- name: Ensure kubeconfig output directory exists
  ansible.builtin.file:
    path: "{{ _rbac_bootstrap_output_dir }}"
    state: directory
    mode: "0700"
  when: acm_switchover_execution.mode | default('dry_run') != 'dry_run'

- name: Generate kubeconfig from service account
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "{{ _rbac_bootstrap_script }}"
      - --context
      - "{{ acm_switchover_hubs.primary.context }}"
      - --kubeconfig
      - "{{ acm_switchover_hubs.primary.kubeconfig }}"
      - --user
      - "{{ item.user_name }}"
      - --token-duration
      - "{{ acm_switchover_rbac_bootstrap.token_duration | default('24h', true) }}"
      - "{{ _rbac_bootstrap_namespace }}"
      - "{{ item.service_account_name }}"
  register: _rbac_generated_kubeconfigs
  loop: "{{ _rbac_bootstrap_kubeconfig_targets }}"
  loop_control:
    label: "{{ item.role }}"
  changed_when: true
  no_log: true
  when: acm_switchover_execution.mode | default('dry_run') != 'dry_run'

- name: Write generated service account kubeconfig
  ansible.builtin.copy:
    content: "{{ item.stdout }}"
    dest: "{{ item.item.path }}"
    mode: "0600"
  loop: "{{ _rbac_generated_kubeconfigs.results | default([]) }}"
  loop_control:
    label: "{{ item.item.role }}"
  no_log: true
  when: acm_switchover_execution.mode | default('dry_run') != 'dry_run'

- name: Publish generated service account kubeconfig path
  ansible.builtin.set_fact:
    acm_switchover_rbac_bootstrap_generated_kubeconfig: >-
      {{
        _rbac_bootstrap_kubeconfig_targets[0].path
        if (_rbac_bootstrap_kubeconfig_targets | length) == 1
        else ''
      }}
    acm_switchover_rbac_bootstrap_generated_kubeconfigs: >-
      {%- set paths = {} -%}
      {%- for target in _rbac_bootstrap_kubeconfig_targets -%}
        {%- set _ = paths.update({target.role: target.path}) -%}
      {%- endfor -%}
      {{ paths }}
