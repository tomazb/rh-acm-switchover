---
# #284: RBAC bootstrap has no non-mutating validate path, and the Python CLI refuses
# --validate-only together with --setup. Refused before any read, in every mode including
# native check mode; an unknown mode is refused the same way.
- name: Refuse validate and unknown execution modes before any read
  ansible.builtin.assert:
    that:
      - (acm_switchover_execution.mode | default('dry_run')) in ['execute', 'dry_run']
    fail_msg: >-
      rbac_bootstrap refuses execution mode
      '{{ acm_switchover_execution.mode | default('dry_run') }}': it supports execute,
      or dry_run to preview. Validation applies no RBAC, as acm_switchover.py
      --validate-only cannot be combined with --setup.
    quiet: true

- name: Plan RBAC manifest selection
  tomazb.acm_switchover.acm_rbac_bootstrap:
    role: "{{ acm_switchover_rbac_bootstrap.role }}"
    include_decommission: "{{ acm_switchover_rbac_bootstrap.include_decommission }}"
    generate_kubeconfigs: "{{ acm_switchover_rbac_bootstrap.generate_kubeconfigs }}"
  register: _rbac_plan

- name: Apply RBAC manifests
  ansible.builtin.include_tasks: deploy_manifests.yml

- name: Generate kubeconfigs
  ansible.builtin.include_tasks: generate_kubeconfigs.yml
  when: acm_switchover_rbac_bootstrap.generate_kubeconfigs | bool

- name: Validate permissions
  ansible.builtin.include_tasks: validate_permissions.yml
  when: acm_switchover_rbac_bootstrap.validate_permissions | bool

- name: Publish rbac_bootstrap result
  ansible.builtin.set_fact:
    acm_switchover_rbac_bootstrap_result:
      phase: rbac_bootstrap
      mode: "{{ acm_switchover_execution.mode | default('dry_run') }}"
      role: "{{ acm_switchover_rbac_bootstrap.role }}"
      assets_applied: "{{ _rbac_plan.assets }}"
      generated_kubeconfig: "{{ acm_switchover_rbac_bootstrap_generated_kubeconfig | default('') }}"
      generated_kubeconfigs: "{{ acm_switchover_rbac_bootstrap_generated_kubeconfigs | default({}) }}"
      status: pass
  when: acm_switchover_execution.mode | default('dry_run') == 'execute'

# A dry run applies and generates nothing: the applied lists stay empty and the plan is
# reported under planned_assets and planned_kubeconfigs.
- name: Publish rbac_bootstrap preview result
  ansible.builtin.set_fact:
    acm_switchover_rbac_bootstrap_result:
      phase: rbac_bootstrap
      mode: "{{ acm_switchover_execution.mode | default('dry_run') }}"
      role: "{{ acm_switchover_rbac_bootstrap.role }}"
      assets_applied: []
      planned_assets: "{{ _rbac_plan.assets }}"
      generated_kubeconfig: ""
      generated_kubeconfigs: {}
      planned_kubeconfigs: "{{ acm_switchover_rbac_bootstrap_planned_kubeconfigs | default({}) }}"
      status: pass
  when: acm_switchover_execution.mode | default('dry_run') != 'execute'

- name: Resolve summary path to absolute
  ansible.builtin.set_fact:
    _acm_summary_path_abs: "{{ summary_path | tomazb.acm_switchover.acm_abs_path(lookup('env', 'PWD')) }}"
  when: summary_path is defined

- name: Write summary when requested
  tomazb.acm_switchover.acm_report_artifact:
    path: "{{ _acm_summary_path_abs }}"
    report: "{{ acm_switchover_rbac_bootstrap_result }}"
    mode: "0644"
  when: summary_path is defined
