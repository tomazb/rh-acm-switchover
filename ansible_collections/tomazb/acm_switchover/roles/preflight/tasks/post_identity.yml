---
- name: Validate required checkpoint data when preflight is skipped
  ansible.builtin.assert:
    that:
      - >-
        (((_checkpoint_enter | default({})).get('facts', {})).get('expected_managed_cluster_names', none))
        is not none
      - >-
        (((_checkpoint_enter | default({})).get('facts', {})).get('expected_managed_cluster_count', none))
        is not none
      - >-
        (((_checkpoint_enter | default({})).get('facts', {})).get('primary_has_observability', none))
        is not none
      - >-
        (((_checkpoint_enter | default({})).get('facts', {})).get('secondary_has_observability', none))
        is not none
    fail_msg: >-
      Skipped preflight checkpoint is missing required operational metadata
      (expected_managed_cluster_names/expected_managed_cluster_count and
      primary_has_observability/secondary_has_observability). Re-run preflight
      so activation and post-activation can enforce the restore and Observability expectations.
  when:
    - (_checkpoint_enter | default({})).skipped_phase | default(false)
    # Intentional default('execute'): this is a read-only validation assert,
    # not a mutation task. Over-validating checkpoint data when mode is unknown
    # is safer than silently skipping validation.
    - acm_switchover_execution.mode | default('execute') == 'execute'

- name: Restore operational facts from checkpoint when preflight is skipped
  ansible.builtin.set_fact:
    acm_switchover_expected_managed_cluster_names: >-
      {{ ((_checkpoint_enter | default({})).get('facts', {})).get('expected_managed_cluster_names') }}
    acm_switchover_expected_managed_cluster_count: >-
      {{ ((_checkpoint_enter | default({})).get('facts', {})).get('expected_managed_cluster_count') }}
    acm_switchover_primary_has_observability: >-
      {{ ((_checkpoint_enter | default({})).get('facts', {})).get('primary_has_observability') }}
    acm_switchover_secondary_has_observability: >-
      {{ ((_checkpoint_enter | default({})).get('facts', {})).get('secondary_has_observability') }}
  when:
    - (_checkpoint_enter | default({})).skipped_phase | default(false)
    - >-
      (((_checkpoint_enter | default({})).get('facts', {})).get('expected_managed_cluster_names', none))
      is not none
    - >-
      (((_checkpoint_enter | default({})).get('facts', {})).get('expected_managed_cluster_count', none))
      is not none
    - >-
      (((_checkpoint_enter | default({})).get('facts', {})).get('primary_has_observability', none))
      is not none
    - >-
      (((_checkpoint_enter | default({})).get('facts', {})).get('secondary_has_observability', none))
      is not none

- name: Record whether full preflight validation should run
  ansible.builtin.set_fact:
    _acm_preflight_run_validations: "{{ acm_switchover_preflight_summary.passed | bool }}"
    _acm_preflight_rbac_validation_completed: false

- name: Run preflight phase
  when:
    - _acm_preflight_run_validations | default(false) | bool
    - not ((_checkpoint_enter | default({})).skipped_phase | default(false))
  block:

    - name: Record GitOps drift warning (informational only)
      ansible.builtin.include_tasks: validate_gitops.yml

    - name: Check for orphaned auto-import obligation from a prior run
      ansible.builtin.include_tasks: check_auto_import_orphan.yml

    - name: Discover resources needed by later preflight checks
      ansible.builtin.include_tasks: discover_resources.yml
      when: acm_switchover_preflight_summary.passed

    # #340 E1: only a positively complete strict primary inventory derives the expectation;
    # a refused derivation is a critical preflight result, never zero expected names.
    - name: Derive expected ManagedClusters from the strict primary inventory
      tomazb.acm_switchover.acm_migration_evidence:
        operation: expected_managed_clusters
        inputs:
          mc_read: "{{ _acm_primary_managed_clusters_derivation_read | default({}) }}"
      register: _acm_expected_managed_clusters
      when:
        - acm_switchover_preflight_summary.passed
        - not (acm_switchover_operation.restore_only | default(false))

    - name: Record the expected ManagedCluster derivation result
      ansible.builtin.set_fact:
        acm_switchover_validation_results: >-
          {{
            acm_switchover_validation_results
            + [
              {
                "id": "preflight-managed-cluster-inventory",
                "severity": "critical",
                "status": "pass" if _acm_expected_managed_clusters.derivable else "fail",
                "message": _acm_expected_managed_clusters.message,
                "details": {
                  "expected_managed_cluster_names": _acm_expected_managed_clusters.names,
                  "expected_managed_cluster_count": _acm_expected_managed_clusters.count
                }
                if _acm_expected_managed_clusters.derivable
                else {"code": _acm_expected_managed_clusters.code},
                "recommended_action": None
                  if _acm_expected_managed_clusters.derivable
                  else "Restore a complete, readable ManagedCluster inventory on the primary hub and re-run preflight"
              }
            ]
          }}
      when:
        - acm_switchover_preflight_summary.passed
        - not (acm_switchover_operation.restore_only | default(false))

    - name: Publish the expected ManagedClusters
      ansible.builtin.set_fact:
        acm_switchover_expected_managed_cluster_names: >-
          {{
            (_acm_expected_managed_clusters.names or [])
            if not (acm_switchover_operation.restore_only | default(false))
            else []
          }}
        acm_switchover_expected_managed_cluster_count: >-
          {{
            (_acm_expected_managed_clusters.count or 0)
            if not (acm_switchover_operation.restore_only | default(false))
            else 0
          }}
      when: acm_switchover_preflight_summary.passed

    - name: Validate kubeconfig reachability
      ansible.builtin.include_tasks: validate_kubeconfigs.yml
      when: acm_switchover_preflight_summary.passed

    - name: Record controller tooling advisory
      ansible.builtin.include_tasks: validate_tooling.yml
      when: acm_switchover_preflight_summary.passed

    - name: Validate ACM version compatibility
      ansible.builtin.include_tasks: validate_versions.yml
      when: acm_switchover_preflight_summary.passed

    - name: Validate auto-import strategy advisory
      ansible.builtin.include_tasks: validate_auto_import.yml
      when: acm_switchover_preflight_summary.passed

    - name: Validate required namespaces and base hub components
      ansible.builtin.include_tasks: validate_namespaces.yml
      when: acm_switchover_preflight_summary.passed

    - name: Record effective Observability detection
      ansible.builtin.set_fact:
        acm_switchover_primary_has_observability: >-
          {{
            not (acm_switchover_operation.restore_only | default(false) | bool)
            and not (acm_switchover_features.skip_observability_checks | default(false) | bool)
            and 'open-cluster-management-observability' in (acm_primary_namespace_names | default([]))
          }}
        acm_switchover_secondary_has_observability: >-
          {{
            not (acm_switchover_features.skip_observability_checks | default(false) | bool)
            and 'open-cluster-management-observability' in (acm_secondary_namespace_names | default([]))
          }}
      when: acm_switchover_preflight_summary.passed

    - name: Validate RBAC permissions when enabled
      ansible.builtin.include_tasks: validate_rbac.yml
      when:
        - acm_switchover_preflight_summary.passed
        - not (acm_switchover_features.skip_rbac_validation | default(false))

    - name: Validate backup, restore, and cluster backup prerequisites
      ansible.builtin.include_tasks: validate_backups.yml
      when: >-
        acm_switchover_preflight_summary.passed
        or (_acm_preflight_rbac_validation_completed | default(false) | bool)

    - name: Recompute aggregate preflight summary from collected results
      ansible.builtin.set_fact:
        acm_switchover_preflight_summary:
          passed: "{{ ((acm_switchover_validation_results | selectattr('severity', 'equalto', 'critical') | selectattr('status', 'in', ['fail', 'error']) | list | length) == 0) | bool }}"
          critical_failures: "{{ (acm_switchover_validation_results | selectattr('severity', 'equalto', 'critical') | selectattr('status', 'in', ['fail', 'error']) | list | length) | int }}"
          warning_failures: "{{ (acm_switchover_validation_results | selectattr('severity', 'equalto', 'warning') | selectattr('status', 'in', ['fail', 'error']) | list | length) | int }}"
  rescue:
    - name: Mark checkpoint failure
      tomazb.acm_switchover.checkpoint_phase:
        phase: preflight
        checkpoint: "{{ acm_switchover_execution.checkpoint | default({}) }}"
        status: fail
        error: "{{ ansible_failed_result.msg | default('unknown failure') }}"
      when: acm_switchover_execution.checkpoint.enabled | default(false)

    - name: Re-raise failure
      ansible.builtin.fail:
        msg: "Phase preflight failed; correct the reported validation failures and retry."

- name: Persist report and summary facts
  ansible.builtin.include_tasks: write_report.yml
  when: not ((_checkpoint_enter | default({})).skipped_phase | default(false))

- name: Stop on critical preflight failures
  ansible.builtin.fail:
    msg: >-
      Preflight failed with {{ acm_switchover_preflight_summary.critical_failures }} critical finding(s).
      See the structured preflight report artifact for details.
  when:
    - not ((_checkpoint_enter | default({})).skipped_phase | default(false))
    - not acm_switchover_preflight_summary.passed

# July design section 2: a waiver is rejected when a scope it covers has no
# expected name to waive. The input is already well formed (acm_input_validate
# accepts only a real boolean enabling field, which `is sameas true` reads alike).
- name: Reject a ManagedCluster expectation waiver with no expected name to waive
  ansible.builtin.assert:
    that:
      - >-
        not ((acm_switchover_operation.skip_managed_cluster_expectations | default(false)) is sameas true)
        or (
          (
            _acm_waiver_scope not in ['activation', 'both']
            or (_acm_waiver_activation_names | length) > 0
          )
          and (
            _acm_waiver_scope not in ['post_activation', 'both']
            or (_acm_waiver_post_activation_names | length) > 0
          )
        )
    fail_msg: >-
      waiver_expected_names_empty: skip_managed_cluster_expectations was requested with scope
      {{ _acm_waiver_scope }}, but that scope has no expected ManagedCluster name to waive.
  vars:
    _acm_waiver_scope: >-
      {{ (acm_switchover_operation.managed_cluster_expectation_waiver | default({}, true)).get('scope') }}
    _acm_waiver_activation_names: >-
      {{
        []
        if (acm_switchover_operation.restore_only | default(false) | bool)
        else (acm_switchover_expected_managed_cluster_names | default([], true))
      }}
    _acm_waiver_post_activation_names: "{{ _acm_waiver_activation_names }}"

- name: Mark checkpoint phase completion
  tomazb.acm_switchover.checkpoint_phase:
    phase: preflight
    checkpoint: "{{ acm_switchover_execution.checkpoint | default({}) }}"
    status: pass
    report_ref: "{{ acm_switchover_preflight_result.path | default(omit) }}"
    operational_data:
      expected_managed_cluster_names: "{{ acm_switchover_expected_managed_cluster_names | default([]) }}"
      expected_managed_cluster_count: "{{ acm_switchover_expected_managed_cluster_count | default(0) }}"
      primary_has_observability: "{{ acm_switchover_primary_has_observability | default(false) | bool }}"
      secondary_has_observability: "{{ acm_switchover_secondary_has_observability | default(false) | bool }}"
  when:
    - acm_switchover_execution.checkpoint.enabled | default(false)
    - acm_switchover_preflight_summary.passed
    - not ((_checkpoint_enter | default({})).skipped_phase | default(false))
