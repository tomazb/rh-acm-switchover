  retries: "{{ acm_switchover_backup_wait_retries | default(60) }}"
  delay: "{{ acm_switchover_backup_wait_delay | default(10) }}"
  changed_when: false
  failed_when: false
  when:
    - acm_switchover_operation.restore_only | default(false)
    - (_acm_secondary_in_progress_backups | default([]) | length) > 0

- name: Read restore-only target backups after in-progress wait
  kubernetes.core.k8s_info:
    api_version: velero.io/v1
    kind: Backup
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: acm_secondary_backups_info
  when:
    - acm_switchover_operation.restore_only | default(false)
    - (_acm_secondary_in_progress_backups | default([]) | length) > 0

- name: Identify restore-only target backups still in progress after wait
  ansible.builtin.set_fact:
    _acm_secondary_remaining_in_progress_backups: >-
      {%- set names = [] -%}
      {%- for backup in (acm_secondary_backups_info.resources | default([])) -%}
      {%- if backup.get('status', {}).get('phase') == 'InProgress' -%}
      {%- set _ = names.append(backup.get('metadata', {}).get('name', 'unknown')) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ names | to_json }}
  when:
    - acm_switchover_operation.restore_only | default(false)
    - (_acm_secondary_in_progress_backups | default([]) | length) > 0

- name: Record restore-only target backups still in progress after wait
  ansible.builtin.set_fact:
    acm_switchover_validation_results: >-
      {{
        acm_switchover_validation_results
        + [
          {
            "id": "preflight-backup-in-progress-after-wait-restore-only",
            "severity": "critical",
            "status": "fail",
            "message": "restore-only target backup(s) still InProgress after waiting",
            "details": {
              "backup_names": _acm_secondary_remaining_in_progress_backups | default('[]') | from_json,
              "attempts": _acm_secondary_backup_wait_info.attempts | default(0)
            },
            "recommended_action": "Wait for Velero backups to complete or investigate stuck restore-only target backup jobs before activation"
          }
        ]
      }}
  when:
    - acm_switchover_operation.restore_only | default(false)
    - (_acm_secondary_remaining_in_progress_backups | default('[]') | from_json | length) > 0
