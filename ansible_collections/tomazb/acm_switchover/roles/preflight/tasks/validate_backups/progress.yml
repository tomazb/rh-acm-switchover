      {%- set _ = names.append(backup.get('metadata', {}).get('name', 'unknown')) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ names }}
  when: acm_switchover_operation.restore_only | default(false)

- name: Wait for restore-only target in-progress backups to finish
  kubernetes.core.k8s_info:
    api_version: velero.io/v1
    kind: Backup
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: _acm_secondary_backup_wait_info
  until: >-
