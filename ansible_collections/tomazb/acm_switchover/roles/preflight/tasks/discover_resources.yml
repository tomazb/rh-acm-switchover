---
- name: Read primary hub namespaces when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: acm_primary_namespace_info
  when:
    - acm_primary_namespace_info is not defined
    - not (acm_switchover_operation.restore_only | default(false))

- name: Read secondary hub namespaces when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: acm_secondary_namespace_info
  when: acm_secondary_namespace_info is not defined

- name: Read primary MultiClusterHub when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: operator.open-cluster-management.io/v1
    kind: MultiClusterHub
    namespace: open-cluster-management
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: acm_primary_mch_info
  when:
    - not (acm_switchover_operation.restore_only | default(false))
    - >-
      (acm_switchover_execution.mode | default('dry_run') == 'execute')
      or (acm_primary_mch_info is not defined)

- name: Read secondary MultiClusterHub when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: operator.open-cluster-management.io/v1
    kind: MultiClusterHub
    namespace: open-cluster-management
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: acm_secondary_mch_info
  when: >-
    (acm_switchover_execution.mode | default('dry_run') == 'execute')
    or (acm_secondary_mch_info is not defined)

- name: Read primary hub backups when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: velero.io/v1
    kind: Backup
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: acm_primary_backups_info
  when:
    - acm_primary_backups_info is not defined
    - not (acm_switchover_operation.restore_only | default(false))

- name: Read secondary hub backups when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: velero.io/v1
    kind: Backup
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: acm_secondary_backups_info
  when: acm_secondary_backups_info is not defined

- name: Read primary hub Velero pods when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: open-cluster-management-backup
    label_selectors:
      - "app.kubernetes.io/name=velero"
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: acm_primary_velero_pods_info
  when:
    - acm_primary_velero_pods_info is not defined
    - not (acm_switchover_operation.restore_only | default(false))

- name: Read secondary hub Velero pods when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: open-cluster-management-backup
    label_selectors:
      - "app.kubernetes.io/name=velero"
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: acm_secondary_velero_pods_info
  when: acm_secondary_velero_pods_info is not defined

- name: Read primary hub BackupSchedules when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: cluster.open-cluster-management.io/v1beta1
    kind: BackupSchedule
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: acm_primary_backup_schedules_info
  when:
    - acm_primary_backup_schedules_info is not defined
    - not (acm_switchover_operation.restore_only | default(false))

- name: Read primary hub BackupStorageLocations when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: velero.io/v1
    kind: BackupStorageLocation
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: acm_primary_bsl_info
  when:
    - acm_primary_bsl_info is not defined
    - not (acm_switchover_operation.restore_only | default(false))

- name: Read primary hub DataProtectionApplications when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: oadp.openshift.io/v1alpha1
    kind: DataProtectionApplication
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: acm_primary_dpa_info
  when:
    - acm_primary_dpa_info is not defined
    - not (acm_switchover_operation.restore_only | default(false))

- name: Read secondary hub DataProtectionApplications when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: oadp.openshift.io/v1alpha1
    kind: DataProtectionApplication
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: acm_secondary_dpa_info
  when: acm_secondary_dpa_info is not defined

- name: Read secondary hub BackupStorageLocations when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: velero.io/v1
    kind: BackupStorageLocation
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: acm_secondary_bsl_info
  when: acm_secondary_bsl_info is not defined

- name: Read secondary passive restore resource when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: cluster.open-cluster-management.io/v1beta1
    kind: Restore
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: acm_secondary_restore_info
  when: acm_secondary_restore_info is not defined

- name: Read primary hub ClusterDeployments when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: hive.openshift.io/v1
    kind: ClusterDeployment
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: acm_primary_cluster_deployments_info
  when:
    - acm_primary_cluster_deployments_info is not defined
    - not (acm_switchover_operation.restore_only | default(false))

# #340 E1: the expected ManagedCluster set is derived from this read, so it is one strict LIST
# through the shared strict-read seam: an executing run always reads the live primary, and only
# dry_run/validate honour a pre-seeded acm_switchover_test_overrides.migration_reads entry.
- name: Read primary ManagedClusters strictly
  ansible.builtin.include_tasks: "{{ role_path }}/../activation/tasks/strict_read.yml"
  vars:
    _acm_read:
      key: primary_managedclusters
      hub: primary
      read_mode: list
      api_version: cluster.open-cluster-management.io/v1
      kind: ManagedCluster
      resource_name: managedclusters
    # A private fact: the public acm_primary_*_info names are the documented pre-seed pattern, so a
    # vars file carrying one by accident must not become the derivation input in execute mode.
    _acm_read_fact: _acm_primary_managed_clusters_read
  when: not (acm_switchover_operation.restore_only | default(false))

- name: Publish the primary ManagedCluster inventory for the other preflight checks
  ansible.builtin.set_fact:
    acm_primary_managed_clusters_info: "{{ _acm_primary_managed_clusters_read }}"
  when: not (acm_switchover_operation.restore_only | default(false))

- name: Read primary hub ManagedCluster backups when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: cluster.open-cluster-management.io/v1beta1
    kind: ManagedClusterBackup
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: acm_primary_managed_cluster_backups_info
  when:
    - acm_primary_managed_cluster_backups_info is not defined
    - not (acm_switchover_operation.restore_only | default(false))

- name: Seed empty primary facts for restore-only mode
  ansible.builtin.set_fact:
    acm_primary_namespace_info: { resources: [] }
    acm_primary_mch_info: { resources: [] }
    acm_primary_backups_info: { resources: [] }
    acm_primary_velero_pods_info: { resources: [] }
    acm_primary_backup_schedules_info: { resources: [] }
    acm_primary_bsl_info: { resources: [] }
    acm_primary_dpa_info: { resources: [] }
    acm_primary_cluster_deployments_info: { resources: [] }
    acm_primary_managed_clusters_info: { resources: [] }
    acm_primary_managed_cluster_backups_info: { resources: [] }
  when:
    - acm_switchover_operation.restore_only | default(false)
    - acm_primary_mch_info is not defined
