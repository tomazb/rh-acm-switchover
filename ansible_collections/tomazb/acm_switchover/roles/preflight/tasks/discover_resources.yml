  register: acm_secondary_backups_info
  when: acm_secondary_backups_info is not defined

- name: Read primary hub Velero pods when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: open-cluster-management-backup
    label_selectors:
