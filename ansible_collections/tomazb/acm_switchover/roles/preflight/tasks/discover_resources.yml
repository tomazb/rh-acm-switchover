- name: Read primary hub ClusterDeployments when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: hive.openshift.io/v1
    kind: ClusterDeployment
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: acm_primary_cluster_deployments_info
  when:
    - acm_primary_cluster_deployments_info is not defined
    - not (acm_switchover_operation.restore_only | default(false))

# #340 E1: the expected ManagedCluster set is derived from this read, so it is one strict LIST.
# An executing run always reads the live primary and derives from that read's own register:
# extra vars outrank registered results and set_fact, so the public fact is never the
# derivation input in execute mode. A pre-seeded acm_primary_managed_clusters_info serves only
# dry_run/validate fixtures. Only the outcome is published: the registered result also echoes
# the module arguments.
- name: Read primary ManagedClusters strictly
  tomazb.acm_switchover.acm_k8s_read_outcome:
    read_mode: list
    api_version: cluster.open-cluster-management.io/v1
    kind: ManagedCluster
    resource_name: managedclusters
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: _acm_primary_managed_clusters_read
  no_log: true
  when:
    - not (acm_switchover_operation.restore_only | default(false))
    - >-
      (acm_switchover_execution.mode | default('dry_run') == 'execute')
      or (acm_primary_managed_clusters_info is not defined)

- name: Publish the primary ManagedCluster read
  ansible.builtin.set_fact:
    _acm_primary_managed_clusters_derivation_read: >-
      {{
        {
          'read_status': _acm_primary_managed_clusters_read.read_status | default('error'),
          'resources': _acm_primary_managed_clusters_read.resources | default([]),
          'resource_version': _acm_primary_managed_clusters_read.resource_version | default(none),
        }
        if (_acm_primary_managed_clusters_read is not skipped)
        else acm_primary_managed_clusters_info
      }}
  when: not (acm_switchover_operation.restore_only | default(false))

- name: Publish the primary ManagedCluster inventory for the other preflight checks
  ansible.builtin.set_fact:
    acm_primary_managed_clusters_info: "{{ _acm_primary_managed_clusters_derivation_read }}"
  when: not (acm_switchover_operation.restore_only | default(false))

- name: Read primary hub ManagedCluster backups when not pre-seeded by tests
  kubernetes.core.k8s_info:
    api_version: cluster.open-cluster-management.io/v1beta1
    kind: ManagedClusterBackup
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: acm_primary_managed_cluster_backups_info
  when:
    - acm_primary_managed_cluster_backups_info is not defined
    - not (acm_switchover_operation.restore_only | default(false))

- name: Seed empty primary facts for restore-only mode
  ansible.builtin.set_fact:
    acm_primary_namespace_info: { resources: [] }
    acm_primary_mch_info: { resources: [] }
    acm_primary_backups_info: { resources: [] }
    acm_primary_velero_pods_info: { resources: [] }
    acm_primary_backup_schedules_info: { resources: [] }
    acm_primary_bsl_info: { resources: [] }
    acm_primary_dpa_info: { resources: [] }
    acm_primary_cluster_deployments_info: { resources: [] }
    acm_primary_managed_clusters_info: { resources: [] }
    acm_primary_managed_cluster_backups_info: { resources: [] }
  when:
    - acm_switchover_operation.restore_only | default(false)
    - acm_primary_mch_info is not defined
