---
- name: Identify primary backups still in progress
  ansible.builtin.set_fact:
    _acm_primary_in_progress_backups: >-
      {%- set names = [] -%}
      {%- for backup in (acm_primary_backups_info.resources | default([])) -%}
      {%- if backup.get('status', {}).get('phase') == 'InProgress' -%}
      {%- set _ = names.append(backup.get('metadata', {}).get('name', 'unknown')) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ names }}
  when: not (acm_switchover_operation.restore_only | default(false))

- name: Wait for primary in-progress backups to finish
  kubernetes.core.k8s_info:
    api_version: velero.io/v1
    kind: Backup
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: _acm_primary_backup_wait_info
  until: >-
    {{
      (
        _acm_primary_backup_wait_info.resources | default([])
        | selectattr('status.phase', 'equalto', 'InProgress')
        | list
        | length
      ) == 0
    }}
  retries: "{{ acm_switchover_backup_wait_retries | default(60) }}"
  delay: "{{ acm_switchover_backup_wait_delay | default(10) }}"
  changed_when: false
  failed_when: false
  when:
    - not (acm_switchover_operation.restore_only | default(false))
    - (_acm_primary_in_progress_backups | default([]) | length) > 0

- name: Read primary hub backups after in-progress wait
  kubernetes.core.k8s_info:
    api_version: velero.io/v1
    kind: Backup
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context }}"
  register: acm_primary_backups_info
  when:
    - not (acm_switchover_operation.restore_only | default(false))
    - (_acm_primary_in_progress_backups | default([]) | length) > 0

- name: Identify restore-only target backups still in progress
  ansible.builtin.set_fact:
    _acm_secondary_in_progress_backups: >-
      {%- set names = [] -%}
      {%- for backup in (acm_secondary_backups_info.resources | default([])) -%}
      {%- if backup.get('status', {}).get('phase') == 'InProgress' -%}
      {%- set _ = names.append(backup.get('metadata', {}).get('name', 'unknown')) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ names }}
  when: acm_switchover_operation.restore_only | default(false)

- name: Wait for restore-only target in-progress backups to finish
  kubernetes.core.k8s_info:
    api_version: velero.io/v1
    kind: Backup
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: _acm_secondary_backup_wait_info
  until: >-
    {{
      (
        _acm_secondary_backup_wait_info.resources | default([])
        | selectattr('status.phase', 'equalto', 'InProgress')
        | list
        | length
      ) == 0
    }}
  retries: "{{ acm_switchover_backup_wait_retries | default(60) }}"
  delay: "{{ acm_switchover_backup_wait_delay | default(10) }}"
  changed_when: false
  failed_when: false
  when:
    - acm_switchover_operation.restore_only | default(false)
    - (_acm_secondary_in_progress_backups | default([]) | length) > 0

- name: Read restore-only target backups after in-progress wait
  kubernetes.core.k8s_info:
    api_version: velero.io/v1
    kind: Backup
    namespace: open-cluster-management-backup
    kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.secondary.context }}"
  register: acm_secondary_backups_info
  when:
    - acm_switchover_operation.restore_only | default(false)
    - (_acm_secondary_in_progress_backups | default([]) | length) > 0

- name: Record latest backup existence
  ansible.builtin.set_fact:
    acm_switchover_validation_results: >-
      {{
        acm_switchover_validation_results
        + [
          {
            "id": "preflight-backup-latest",
            "severity": "critical",
            "status": "pass" if (acm_primary_backups_info.resources | default([]) | length) > 0 else "fail",
            "message": "primary hub has at least one backup artifact"
              if (acm_primary_backups_info.resources | default([]) | length) > 0
              else "primary hub has no Velero backup artifacts",
            "details": {
              "backup_count": acm_primary_backups_info.resources | default([]) | length
            },
            "recommended_action": "Run or repair ACM backup jobs on the primary hub"
              if (acm_primary_backups_info.resources | default([]) | length) == 0
              else None
          }
        ]
      }}
  when: not (acm_switchover_operation.restore_only | default(false))

- name: Record restore-only backup existence on target hub
  ansible.builtin.set_fact:
    acm_switchover_validation_results: >-
      {{
        acm_switchover_validation_results
        + [
          {
            "id": "preflight-backup-latest-restore-only",
            "severity": "critical",
            "status": "pass" if (acm_secondary_backups_info.resources | default([]) | length) > 0 else "fail",
            "message": "restore-only target hub has at least one backup artifact"
              if (acm_secondary_backups_info.resources | default([]) | length) > 0
              else "restore-only target hub has no Velero backup artifacts",
            "details": {
              "backup_count": acm_secondary_backups_info.resources | default([]) | length
            },
            "recommended_action": "Verify the target hub points at the correct backup bucket and that Velero has synced the backup artifacts"
              if (acm_secondary_backups_info.resources | default([]) | length) == 0
              else None
          }
        ]
      }}
  when: acm_switchover_operation.restore_only | default(false)

- name: Identify latest primary Velero backup
  ansible.builtin.set_fact:
    _acm_primary_latest_backup: "{{ (acm_primary_backups_info.resources | default([]) | sort(attribute='metadata.creationTimestamp') | last | default({})) }}"
  when: not (acm_switchover_operation.restore_only | default(false))

- name: Record latest primary Velero backup completion
  ansible.builtin.set_fact:
    acm_switchover_validation_results: >-
      {{
        acm_switchover_validation_results
        + [
          {
            "id": "preflight-backup-latest-completed",
            "severity": "critical",
            "status": "pass"
              if (
                (acm_primary_backups_info.resources | default([]) | length) > 0
                and (_acm_primary_latest_backup.get('status', {}).get('phase', 'unknown') == 'Completed')
              )
              else "fail",
            "message": "latest backup " + (_acm_primary_latest_backup.get('metadata', {}).get('name', 'unknown')) + " completed successfully"
              if (
                (acm_primary_backups_info.resources | default([]) | length) > 0
                and (_acm_primary_latest_backup.get('status', {}).get('phase', 'unknown') == 'Completed')
              )
              else "latest backup " + (_acm_primary_latest_backup.get('metadata', {}).get('name', 'unknown')) + " in unexpected state: " + (_acm_primary_latest_backup.get('status', {}).get('phase', 'missing')),
            "details": {
              "backup_name": _acm_primary_latest_backup.get('metadata', {}).get('name'),
              "phase": _acm_primary_latest_backup.get('status', {}).get('phase', 'missing')
            },
            "recommended_action": "Wait for the latest Velero backup to complete or run a fresh backup before switchover"
              if (
                (acm_primary_backups_info.resources | default([]) | length) == 0
                or (_acm_primary_latest_backup.get('status', {}).get('phase', 'unknown') != 'Completed')
              )
              else None
          }
        ]
      }}
  when: not (acm_switchover_operation.restore_only | default(false))

- name: Identify latest restore-only target Velero backup
  ansible.builtin.set_fact:
    _acm_secondary_latest_backup: "{{ (acm_secondary_backups_info.resources | default([]) | sort(attribute='metadata.creationTimestamp') | last | default({})) }}"
  when: acm_switchover_operation.restore_only | default(false)

- name: Record latest restore-only target Velero backup completion
  ansible.builtin.set_fact:
    acm_switchover_validation_results: >-
      {{
        acm_switchover_validation_results
        + [
          {
            "id": "preflight-backup-latest-completed-restore-only",
            "severity": "critical",
            "status": "pass"
              if (
                (acm_secondary_backups_info.resources | default([]) | length) > 0
                and (_acm_secondary_latest_backup.get('status', {}).get('phase', 'unknown') == 'Completed')
              )
              else "fail",
            "message": "latest backup " + (_acm_secondary_latest_backup.get('metadata', {}).get('name', 'unknown')) + " completed successfully"
              if (
                (acm_secondary_backups_info.resources | default([]) | length) > 0
                and (_acm_secondary_latest_backup.get('status', {}).get('phase', 'unknown') == 'Completed')
              )
              else "latest backup " + (_acm_secondary_latest_backup.get('metadata', {}).get('name', 'unknown')) + " in unexpected state: " + (_acm_secondary_latest_backup.get('status', {}).get('phase', 'missing')),
            "details": {
              "backup_name": _acm_secondary_latest_backup.get('metadata', {}).get('name'),
              "phase": _acm_secondary_latest_backup.get('status', {}).get('phase', 'missing')
            },
            "recommended_action": "Wait for the latest Velero backup to complete or sync a completed backup artifact to the target hub"
              if (
                (acm_secondary_backups_info.resources | default([]) | length) == 0
                or (_acm_secondary_latest_backup.get('status', {}).get('phase', 'unknown') != 'Completed')
              )
              else None
          }
        ]
      }}
  when: acm_switchover_operation.restore_only | default(false)

- name: Record BackupSchedule presence
  ansible.builtin.set_fact:
    acm_switchover_validation_results: >-
      {{
        acm_switchover_validation_results
        + [
          {
            "id": "preflight-backup-schedule",
            "severity": "critical",
            "status": "pass" if (acm_primary_backup_schedules_info.resources | default([]) | length) > 0 else "fail",
            "message": "primary hub BackupSchedule exists"
              if (acm_primary_backup_schedules_info.resources | default([]) | length) > 0
              else "primary hub BackupSchedule is missing",
            "details": {
              "schedule_count": acm_primary_backup_schedules_info.resources | default([]) | length
            },
            "recommended_action": "Recreate the ACM BackupSchedule before switchover"
              if (acm_primary_backup_schedules_info.resources | default([]) | length) == 0
              else None
          }
        ]
      }}
  when: not (acm_switchover_operation.restore_only | default(false))

- name: Record BackupSchedule managed service account configuration
  ansible.builtin.set_fact:
    acm_switchover_validation_results: >-
      {{
        acm_switchover_validation_results
        + [
          {
            "id": "preflight-backup-schedule-use-managed-service-account",
            "severity": "critical",
            "status": "pass"
              if (
                (acm_primary_backup_schedules_info.resources | default([]) | length) > 0
                and ((acm_primary_backup_schedules_info.resources | first | default({})).get('spec', {}).get('useManagedServiceAccount', false) | bool)
              )
              else "fail",
            "message": "BackupSchedule useManagedServiceAccount=true"
              if (
                (acm_primary_backup_schedules_info.resources | default([]) | length) > 0
                and ((acm_primary_backup_schedules_info.resources | first | default({})).get('spec', {}).get('useManagedServiceAccount', false) | bool)
              )
              else "BackupSchedule useManagedServiceAccount is not enabled",
            "details": {
              "method": acm_switchover_operation.method,
              "useManagedServiceAccount": ((acm_primary_backup_schedules_info.resources | first | default({})).get('spec', {}).get('useManagedServiceAccount', false) | bool)
            },
            "recommended_action": "Set spec.useManagedServiceAccount=true in the primary BackupSchedule before switchover"
              if (
                (acm_primary_backup_schedules_info.resources | default([]) | length) == 0
                or not ((acm_primary_backup_schedules_info.resources | first | default({})).get('spec', {}).get('useManagedServiceAccount', false) | bool)
              )
              else None
          }
        ]
      }}
  when: not (acm_switchover_operation.restore_only | default(false))

- name: Record primary hub BackupStorageLocation health
  ansible.builtin.set_fact:
    acm_switchover_validation_results: >-
      {{
        acm_switchover_validation_results
        + [
          {
            "id": "preflight-backup-storage-location-primary",
            "severity": "critical",
            "status": "pass"
              if (
                (acm_primary_bsl_info.resources | default([]) | length) > 0
                and ((acm_primary_bsl_info.resources | map(attribute='status.phase', default='Unknown') | list) | difference(['Available']) | length) == 0
              )
              else "fail",
            "message": "primary hub BackupStorageLocations are available"
              if (
                (acm_primary_bsl_info.resources | default([]) | length) > 0
                and ((acm_primary_bsl_info.resources | map(attribute='status.phase', default='Unknown') | list) | difference(['Available']) | length) == 0
              )
              else "primary hub BackupStorageLocation is missing or unavailable",
            "details": {
              "phases": acm_primary_bsl_info.resources | default([]) | map(attribute='status.phase', default='Unknown') | list
            },
            "recommended_action": "Repair object storage access before switchover"
              if (
                (acm_primary_bsl_info.resources | default([]) | length) == 0
                or ((acm_primary_bsl_info.resources | map(attribute='status.phase', default='Unknown') | list) | difference(['Available']) | length) > 0
              )
              else None
          }
        ]
      }}
  when: not (acm_switchover_operation.restore_only | default(false))

- name: Record secondary hub BackupStorageLocation health
  ansible.builtin.set_fact:
    acm_switchover_validation_results: >-
      {{
        acm_switchover_validation_results
        + [
          {
            "id": "preflight-backup-storage-location-secondary",
            "severity": "critical",
            "status": "pass"
              if (
                (acm_secondary_bsl_info.resources | default([]) | length) > 0
                and ((acm_secondary_bsl_info.resources | map(attribute='status.phase', default='Unknown') | list) | difference(['Available']) | length) == 0
              )
              else "fail",
            "message": "secondary hub BackupStorageLocations are available"
              if (
                (acm_secondary_bsl_info.resources | default([]) | length) > 0
                and ((acm_secondary_bsl_info.resources | map(attribute='status.phase', default='Unknown') | list) | difference(['Available']) | length) == 0
              )
              else "secondary hub BackupStorageLocation is missing or unavailable",
            "details": {
              "phases": acm_secondary_bsl_info.resources | default([]) | map(attribute='status.phase', default='Unknown') | list
            },
            "recommended_action": "Repair object storage access on the secondary hub before switchover"
              if (
                (acm_secondary_bsl_info.resources | default([]) | length) == 0
                or ((acm_secondary_bsl_info.resources | map(attribute='status.phase', default='Unknown') | list) | difference(['Available']) | length) > 0
              )
              else None
          }
        ]
      }}

- name: Analyze passive sync restores on secondary hub
  tomazb.acm_switchover.acm_restore_info:
    restores: "{{ acm_secondary_restore_info.resources | default([]) }}"
  register: acm_preflight_passive_restore_analysis
  when: acm_switchover_operation.method != 'full'

- name: Record passive restore availability on secondary hub
  ansible.builtin.set_fact:
    acm_switchover_validation_results: >-
      {{
        acm_switchover_validation_results
        + [
          {
            "id": "preflight-passive-restore-secondary",
            "severity": "critical",
            "status": "pass"
              if (
                acm_switchover_operation.method == 'full'
                or (
                  acm_preflight_passive_restore_analysis.restore is not none
                  and (acm_preflight_passive_restore_analysis.restore_ready | default(false) | bool)
                )
              )
              else "fail",
            "message": "secondary hub passive sync restore is activation-ready"
              if (
                acm_switchover_operation.method == 'full'
                or (
                  acm_preflight_passive_restore_analysis.restore is not none
                  and (acm_preflight_passive_restore_analysis.restore_ready | default(false) | bool)
                )
              )
              else (
                "secondary hub passive sync restore is not activation-ready"
                if acm_preflight_passive_restore_analysis.restore is not none
                else "secondary hub has no sync-enabled passive restore"
              ),
            "details": {
              "method": acm_switchover_operation.method,
              "restore_count": acm_secondary_restore_info.resources | default([]) | length,
              "sync_enabled_count": acm_preflight_passive_restore_analysis.sync_enabled_count | default(0),
              "selected_restore": ((acm_preflight_passive_restore_analysis | default({})).get('restore', {}) or {}).get('metadata', {}).get('name'),
              "restore_phase": acm_preflight_passive_restore_analysis.restore_phase | default(none),
              "restore_ready": acm_preflight_passive_restore_analysis.restore_ready | default(false)
            },
            "recommended_action": (
              "Wait for the Restore to reach Enabled, Finished, Completed, or Running before activation"
              if acm_preflight_passive_restore_analysis.restore is not none
              else "Verify a Restore with syncRestoreWithNewBackups=true exists on the secondary hub"
            )
              if (
                acm_switchover_operation.method != 'full'
                and (
                  acm_preflight_passive_restore_analysis.restore is none
                  or not (acm_preflight_passive_restore_analysis.restore_ready | default(false) | bool)
                )
              )
              else None
          }
        ]
      }}

- name: Record OADP operator presence on primary hub
  ansible.builtin.set_fact:
    acm_switchover_validation_results: >-
      {{
        acm_switchover_validation_results
        + [
          {
            "id": "preflight-oadp-primary",
            "severity": "critical",
            "status": "pass" if (acm_primary_velero_pods_info.resources | default([]) | length) > 0 else "fail",
            "message": "primary hub OADP/Velero pods are present"
              if (acm_primary_velero_pods_info.resources | default([]) | length) > 0
              else "primary hub backup namespace exists but no Velero pods were found",
            "details": {
              "velero_pod_count": acm_primary_velero_pods_info.resources | default([]) | length
            },
            "recommended_action": "Ensure OADP/Velero is installed and healthy on the primary hub"
              if (acm_primary_velero_pods_info.resources | default([]) | length) == 0
              else None
          }
        ]
      }}
  when: not (acm_switchover_operation.restore_only | default(false))

- name: Record OADP operator presence on secondary hub
  ansible.builtin.set_fact:
    acm_switchover_validation_results: >-
      {{
        acm_switchover_validation_results
        + [
          {
            "id": "preflight-oadp-secondary",
            "severity": "critical",
            "status": "pass" if (acm_secondary_velero_pods_info.resources | default([]) | length) > 0 else "fail",
            "message": "secondary hub OADP/Velero pods are present"
              if (acm_secondary_velero_pods_info.resources | default([]) | length) > 0
              else "secondary hub backup namespace exists but no Velero pods were found",
            "details": {
              "velero_pod_count": acm_secondary_velero_pods_info.resources | default([]) | length
            },
            "recommended_action": "Ensure OADP/Velero is installed and healthy on the secondary hub"
              if (acm_secondary_velero_pods_info.resources | default([]) | length) == 0
              else None
          }
        ]
      }}

- name: Record primary hub DataProtectionApplication status
  ansible.builtin.set_fact:
    acm_switchover_validation_results: >-
      {{
        acm_switchover_validation_results
        + [
          {
            "id": "preflight-dpa-primary",
            "severity": "critical",
            "status": "pass"
              if (
                (acm_primary_dpa_info.resources | default([]) | length) > 0
                and (
                  (
                    ((acm_primary_dpa_info.resources | first | default({}))
                    .get('status', {})
                    .get('conditions', []))
                    | selectattr('type', 'equalto', 'Reconciled')
                    | selectattr('status', 'equalto', 'True')
                    | list
                    | length
                  ) > 0
                )
              )
              else "fail",
            "message": "primary hub DataProtectionApplication is reconciled"
              if (
                (acm_primary_dpa_info.resources | default([]) | length) > 0
                and (
                  (
                    ((acm_primary_dpa_info.resources | first | default({}))
                    .get('status', {})
                    .get('conditions', []))
                    | selectattr('type', 'equalto', 'Reconciled')
                    | selectattr('status', 'equalto', 'True')
                    | list
                    | length
                  ) > 0
                )
              )
              else "primary hub DataProtectionApplication is missing or not reconciled",
            "details": {
              "dpa_count": acm_primary_dpa_info.resources | default([]) | length
            },
            "recommended_action": "Install OADP and ensure the primary DataProtectionApplication reports Reconciled=True"
              if (
                (acm_primary_dpa_info.resources | default([]) | length) == 0
                or (
                  (
                    ((acm_primary_dpa_info.resources | first | default({}))
                    .get('status', {})
                    .get('conditions', []))
                    | selectattr('type', 'equalto', 'Reconciled')
                    | selectattr('status', 'equalto', 'True')
                    | list
                    | length
                  ) == 0
                )
              )
              else None
          }
        ]
      }}
  when: not (acm_switchover_operation.restore_only | default(false))

- name: Record secondary hub DataProtectionApplication status
  ansible.builtin.set_fact:
