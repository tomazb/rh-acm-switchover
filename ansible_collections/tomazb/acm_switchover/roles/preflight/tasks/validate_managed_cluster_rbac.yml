---
- name: Verify managed cluster agent namespace exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: open-cluster-management-agent
    kubeconfig: "{{ managed_cluster_target.value.kubeconfig }}"
    context: >-
      {{
        managed_cluster_target.value.context | default('', true)
        if (managed_cluster_target.value.context | default('', true) | length) > 0
        else omit
      }}
  register: _rbac_managed_cluster_agent_namespace
  changed_when: false

- name: Record missing managed cluster agent namespace
  ansible.builtin.set_fact:
    _rbac_denied_permissions_managed_clusters: >-
      {{
        (_rbac_denied_permissions_managed_clusters | default([]))
        + [{
          "target": managed_cluster_target.key,
          "api_group": "",
          "resource": "namespaces",
          "verb": "get",
          "namespace": none,
          "reason": _rbac_managed_cluster_agent_namespace.msg
            | default("Namespace open-cluster-management-agent does not exist on managed cluster")
        }]
      }}
  when:
    - not (_rbac_managed_cluster_agent_namespace.failed | default(false))
    - (_rbac_managed_cluster_agent_namespace.resources | default([]) | length) == 0

- name: Expand required RBAC permissions for managed cluster
  tomazb.acm_switchover.acm_rbac_validate:
    hub: "managed-cluster {{ managed_cluster_target.key }}"
    scope: managed_cluster
  register: _rbac_expanded_managed_cluster
  when:
    - not (_rbac_managed_cluster_agent_namespace.failed | default(false))
    - (_rbac_managed_cluster_agent_namespace.resources | default([]) | length) > 0

- name: Run SelfSubjectAccessReview checks for managed cluster
  ansible.builtin.include_tasks: run_ssar.yml
  vars:
    acm_rbac_permissions: "{{ _rbac_expanded_managed_cluster.permissions }}"
    _ssar_target_kubeconfig: "{{ managed_cluster_target.value.kubeconfig }}"
    _ssar_target_context: "{{ managed_cluster_target.value.context | default('', true) }}"
  when:
    - not (_rbac_managed_cluster_agent_namespace.failed | default(false))
    - (_rbac_managed_cluster_agent_namespace.resources | default([]) | length) > 0

- name: Collect denied permissions for managed cluster
  ansible.builtin.set_fact:
    _rbac_denied_permissions_managed_clusters: >-
      {{
        (_rbac_denied_permissions_managed_clusters | default([]))
        + (
          (_rbac_denied_permissions | default([]))
          | map('combine', {'target': managed_cluster_target.key})
          | list
        )
      }}
  when:
    - not (_rbac_managed_cluster_agent_namespace.failed | default(false))
    - (_rbac_managed_cluster_agent_namespace.resources | default([]) | length) > 0
