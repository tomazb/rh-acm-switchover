---
- name: Announce observability deletion (dry_run)
  ansible.builtin.debug:
    msg: "[dry_run] Would delete all MultiClusterObservability resources"
  when: acm_switchover_execution.mode | default('dry_run') == 'dry_run'

- name: List MultiClusterObservability resources
  kubernetes.core.k8s_info:
    kind: MultiClusterObservability
    api_version: observability.open-cluster-management.io/v1beta2
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context | default(omit) }}"
  register: _multiclusterobservability_resources
  when: acm_switchover_execution.mode | default('dry_run') != 'dry_run'

- name: Delete discovered MultiClusterObservability resources
  kubernetes.core.k8s:
    kind: MultiClusterObservability
    name: "{{ item.metadata.name }}"
    api_version: observability.open-cluster-management.io/v1beta2
    state: absent
    wait: true
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context | default(omit) }}"
  loop: "{{ _multiclusterobservability_resources.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  register: _multiclusterobservability_delete_results
  when: acm_switchover_execution.mode | default('dry_run') != 'dry_run'

- name: Wait for observability pods to terminate
  kubernetes.core.k8s_info:
    kind: Pod
    api_version: v1
    namespace: open-cluster-management-observability
    kubeconfig: "{{ acm_switchover_hubs.primary.kubeconfig }}"
    context: "{{ acm_switchover_hubs.primary.context | default(omit) }}"
  register: _observability_pods_after_delete
  retries: 60
  delay: 10
  failed_when:
    - _observability_pods_after_delete.failed | default(false)
    - "'NotFound' not in (_observability_pods_after_delete.msg | default(''))"
    - "'not found' not in (_observability_pods_after_delete.msg | default('') | lower)"
  until: >-
    (_observability_pods_after_delete.resources | default([]) | length) == 0
    or (
      _observability_pods_after_delete.failed | default(false)
      and (
        'NotFound' in (_observability_pods_after_delete.msg | default(''))
        or 'not found' in (_observability_pods_after_delete.msg | default('') | lower)
      )
    )
  when:
    - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
    - (_multiclusterobservability_resources.resources | default([]) | length) > 0
