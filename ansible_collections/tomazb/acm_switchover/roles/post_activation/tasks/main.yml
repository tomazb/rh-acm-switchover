---
- name: Enter checkpointed phase
  tomazb.acm_switchover.checkpoint_phase:
    phase: post_activation
    checkpoint: "{{ acm_switchover_execution.checkpoint | default({}) }}"
    status: enter
  register: _checkpoint_enter
  when: acm_switchover_execution.checkpoint.enabled | default(false)

# PR C decisions amendment 2.2 rule 3: the Argo CD re-pause a failure rescue left runs
# before any post_activation work, outside the phase rescue (a failed re-pause resumes nothing).
- name: Re-pause Argo CD recorded by a failure rescue
  ansible.builtin.include_role:
    name: tomazb.acm_switchover.argocd_manage
    tasks_from: repause_recovery
  when: not ((_checkpoint_enter | default({})).skipped_phase | default(false))

- name: Run post_activation phase
  when: not ((_checkpoint_enter | default({})).skipped_phase | default(false))
  block:
    # The direct role entry (docs/variable-reference.md) proves its operator inputs
    # before any mutation.
    - name: Guard the post_activation role entry
      ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/guard_role_entry.yml"
      vars:
        _acm_role_entry_phase: post_activation

    - name: Publish dry-run post activation result
      ansible.builtin.set_fact:
        acm_switchover_post_activation_result:
          phase: post_activation
          status: skipped
          changed: false
          reason: dry_run
          summary:
            passed: true
            pending: []
      when: acm_switchover_execution.mode | default('dry_run') == 'dry_run'

    - name: Discover secondary hub resources
      ansible.builtin.include_tasks: discover_resources.yml
      when: acm_switchover_execution.mode | default('dry_run') != 'dry_run'

    - name: Verify managed clusters
      ansible.builtin.include_tasks: verify_managed_clusters.yml
      vars:
        acm_switchover_managed_cluster_wait_soft_fail: true
      when: acm_switchover_execution.mode | default('dry_run') != 'dry_run'

    - name: Verify klusterlet status
      ansible.builtin.include_tasks: verify_klusterlet.yml
      when: acm_switchover_execution.mode | default('dry_run') != 'dry_run'

    - name: Re-verify managed clusters after klusterlet remediation
      ansible.builtin.include_tasks: verify_managed_clusters.yml
      when:
        - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
        - _klusterlet_remediation_attempted | default(false)

    - name: Clean stale disable-auto-import annotations
      ansible.builtin.include_tasks: cleanup_auto_import_annotations.yml
      when: acm_switchover_execution.mode | default('dry_run') != 'dry_run'

    - name: Verify observability
      ansible.builtin.include_tasks: verify_observability.yml
      when:
        - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
        - acm_switchover_secondary_has_observability | default(false) | bool
        - not (acm_switchover_features.skip_observability_checks | default(false))

    - name: Publish post activation result
      ansible.builtin.set_fact:
        acm_switchover_post_activation_result:
          phase: post_activation
          status: "{{ 'pass' if acm_switchover_cluster_verify_result.passed else 'fail' }}"
          changed: false
          summary: "{{ acm_switchover_cluster_verify_result }}"
          klusterlet_probe: "{{ _klusterlet_probe_result | default({}) }}"
          klusterlet_remediation: "{{ _klusterlet_remediation_result | default({}) }}"
          cleanup_auto_import: "{{ acm_switchover_cleanup_auto_import_result | default({}) }}"
          observability: "{{ acm_switchover_observability_check_result | default({}) }}"
      tags:
        - post_activation
        - verify
      when: acm_switchover_execution.mode | default('dry_run') != 'dry_run'

    - name: Fail if post activation checks did not pass
      ansible.builtin.fail:
        msg: >-
          Post activation verification failed:
          {{ acm_switchover_cluster_verify_result.pending | default([]) | join(', ') }} cluster(s) not ready{% if acm_switchover_cluster_verify_result.missing | default([]) | length > 0 %};
          missing expected ManagedCluster(s): {{ acm_switchover_cluster_verify_result.missing | join(', ') }}{% endif %}
      when:
        - acm_switchover_execution.mode | default('dry_run') != 'dry_run'
        - not acm_switchover_cluster_verify_result.passed
  rescue:
    - name: Record the original post_activation failure
      ansible.builtin.set_fact:
        _acm_phase_failure: "{{ ansible_failed_result.msg | default('unknown failure') }}"

    # Amendment 2.2 rule 2: under a migration journal the re-pause marker is durable in
    # this same fail transition, before the play rescue may resume Argo CD. A failed
    # write is reported with the original failure, never instead of it.
    - name: Mark checkpoint failure
      when: acm_switchover_execution.checkpoint.enabled | default(false)
      block:
        - name: Record the failed phase and any Argo CD re-pause obligation
          tomazb.acm_switchover.checkpoint_phase:
            phase: post_activation
            checkpoint: "{{ acm_switchover_execution.checkpoint | default({}) }}"
            status: fail
            error: "{{ _acm_phase_failure }}"
            argocd_repause: >-
              {{
                (acm_switchover_features.argocd.manage | default(false) | bool)
                and (acm_switchover_features.argocd.resume_on_failure | default(false) | bool)
              }}
      rescue:
        - name: Report the failure the checkpoint could not record
          ansible.builtin.fail:
            msg: >-
              {{ _acm_phase_failure }} The checkpoint could not record this failure:
              {{ ansible_failed_result.msg | default('unknown failure') }}. No Argo CD re-pause
              marker is durable, so no Argo CD Application may be resumed.

    - name: Re-raise failure
      ansible.builtin.fail:
        msg: "{{ _acm_phase_failure }}"

- name: Mark checkpoint phase completion
  # No file artifact for post_activation; report_ref not applicable
  tomazb.acm_switchover.checkpoint_phase:
    phase: post_activation
    checkpoint: "{{ acm_switchover_execution.checkpoint | default({}) }}"
    status: pass
  when:
    - acm_switchover_execution.checkpoint.enabled | default(false)
    - not ((_checkpoint_enter | default({})).skipped_phase | default(false))
