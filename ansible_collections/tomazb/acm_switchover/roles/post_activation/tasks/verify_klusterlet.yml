---
- name: Probe klusterlet hub connections
  ansible.builtin.include_tasks: verify_klusterlet_connections.yml
  when:
    - (acm_switchover_managed_clusters | default({}) | length) > 0

- name: Preserve initial klusterlet probe result
  ansible.builtin.set_fact:
    _klusterlet_initial_probe_result: "{{ _klusterlet_probe_result | default({}) }}"
  when:
    - _klusterlet_probe_result is defined

- name: Combine pending and wrong-hub klusterlet remediation candidates
  ansible.builtin.set_fact:
    _klusterlet_remediation_candidates: >-
      {{
        (
          (acm_cluster_verify_result.pending | default([]))
          + (_klusterlet_initial_probe_result.wrong_hub_clusters | default([]))
        )
        | unique
        | list
      }}

- name: Attempt klusterlet auto-remediation
  ansible.builtin.include_tasks: fix_klusterlet.yml
  when:
    - (_klusterlet_remediation_candidates | default([]) | length) > 0
    - (acm_switchover_managed_clusters | default({}) | length) > 0

- name: Re-probe klusterlet hub connections after remediation
  ansible.builtin.include_tasks: verify_klusterlet_connections.yml
  when:
    - _klusterlet_remediation_result is defined
    - (acm_switchover_managed_clusters | default({}) | length) > 0

- name: Preserve post-remediation klusterlet probe result
  ansible.builtin.set_fact:
    _klusterlet_post_remediation_probe_result: "{{ _klusterlet_probe_result | default({}) }}"
  when:
    - _klusterlet_remediation_result is defined
    - _klusterlet_probe_result is defined

- name: Fail when klusterlet remediation remains unresolved after re-check
  ansible.builtin.fail:
    msg: >-
      Klusterlet remediation failed after re-check;
      failed remediation={{ _klusterlet_remediation_result.failed_clusters | default([]) | join(', ') | default('none', true) }};
      still wrong hub={{ _klusterlet_post_remediation_probe_result.wrong_hub_clusters | default([]) | join(', ') | default('none', true) }};
      skipped={{ _klusterlet_post_remediation_probe_result.skipped_clusters | default([]) | join(', ') | default('none', true) }}.
      Skipped clusters without managed-cluster kubeconfigs are non-fatal when ManagedCluster readiness passed.
  when:
    - _klusterlet_remediation_result is defined
    - >
      (_klusterlet_remediation_result.failed_clusters | default([]) | length) > 0
      or (_klusterlet_post_remediation_probe_result.wrong_hub_clusters | default([]) | length) > 0

- name: Record that klusterlet remediation was attempted
  ansible.builtin.set_fact:
    _klusterlet_remediation_attempted: true
  when:
    - _klusterlet_remediation_result is defined
    - (acm_switchover_managed_clusters | default({}) | length) > 0

- name: Note klusterlet remediation candidates
  ansible.builtin.set_fact:
    acm_klusterlet_remediation_note:
      warning: "Klusterlet verification requires manual review - check klusterlet pod logs on managed clusters if clusters fail to connect"
      pending: "{{ acm_cluster_verify_result.pending | default([]) }}"
      wrong_hub: "{{ _klusterlet_initial_probe_result.wrong_hub_clusters | default([]) }}"
      wrong_hub_after_recheck: "{{ _klusterlet_post_remediation_probe_result.wrong_hub_clusters | default([]) }}"
      failed: "{{ _klusterlet_remediation_result.failed_clusters | default([]) }}"
      skipped: "{{ _klusterlet_post_remediation_probe_result.skipped_clusters | default(_klusterlet_remediation_result.skipped_clusters | default([])) }}"
  when: (_klusterlet_remediation_candidates | default([]) | length) > 0
