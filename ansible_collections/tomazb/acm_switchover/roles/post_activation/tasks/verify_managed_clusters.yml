---
- name: Resolve managed-cluster verification expectation
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/resolve_managed_cluster_expectation.yml"
  vars:
    acm_switchover_managed_cluster_expectation_mode: post_activation_verify

- name: Publish post-activation managed-cluster expectation aliases
  ansible.builtin.set_fact:
    _acm_post_activation_configured_managed_cluster_names: "{{ acm_switchover_resolved_configured_managed_cluster_names | default([]) }}"
    _acm_post_activation_allow_zero_managed_clusters: "{{ acm_switchover_resolved_allow_zero_managed_clusters | bool }}"
    _acm_post_activation_min_managed_clusters: "{{ acm_switchover_resolved_min_managed_clusters | int }}"
    _acm_post_activation_expected_managed_cluster_names: "{{ acm_switchover_resolved_expected_managed_cluster_names | default([]) }}"

# After a Velero MC restore, the hub re-creates ManagedCluster objects with
# status from the backup snapshot (often Available=True from the old primary).
# The hub reconciler needs time to detect actual klusterlet connectivity and
# update the condition to reflect reality.  Without this pause, the first
# read catches the stale backup status and the poll completes
# immediately even though the clusters have not reconnected.
- name: Wait for hub reconciler to update managed-cluster status after activation
  ansible.builtin.pause:
    seconds: "{{ _acm_mc_reconcile_pause_seconds | default(30) }}"
  when: (_acm_mc_reconcile_pause_seconds | default(30) | int) > 0

# R4-04: poll the strict complete inventory until the mirrored readiness decision
# (module_utils/migration_post_activation.managed_cluster_readiness, as the Python
# tool's _verify_managed_clusters_connected) holds: an inventory, every expected name
# unless a journaled waiver covers post-activation, the count floor, and every
# non-local cluster Available=True AND Joined=True. A failed read refuses at once and
# is never zero clusters. Budget: 20 polls x 30 s = CLUSTER_VERIFY_TIMEOUT.
- name: Start the managed-cluster readiness wait
  ansible.builtin.set_fact:
    _acm_mc_readiness_state: pending

- name: Wait for managed clusters to become available and joined
  ansible.builtin.include_tasks: poll_managed_cluster_readiness.yml
  loop: "{{ _acm_mc_readiness_poll_delays | default([0] + [30] * 20) }}"
  loop_control:
    loop_var: _acm_poll_delay
  when: _acm_mc_readiness_state != 'ready'

- name: Fail when the managed-cluster readiness is not proven
  ansible.builtin.fail:
    msg: >-
      ManagedCluster readiness is not proven ({{ _acm_mc_readiness.code }}):
      missing expected={{ _acm_mc_readiness.missing | join(', ') }};
      not Available and Joined={{ _acm_mc_readiness.pending | join(', ') }};
      found {{ _acm_mc_readiness.count }}/{{ _acm_post_activation_min_managed_clusters }}
  when:
    - not (acm_switchover_managed_cluster_wait_soft_fail | default(false) | bool)
    - _acm_mc_readiness_state != 'ready'

# Klusterlet verification probes the clusters of the accepted readiness inventory, not the
# earlier discovery read, which may predate a cluster the poll then saw.
- name: Publish the accepted ManagedCluster inventory for klusterlet verification
  ansible.builtin.set_fact:
    acm_secondary_managed_clusters_info: "{{ _acm_mc_readiness_read }}"

- name: Summarize managed cluster conditions
  tomazb.acm_switchover.acm_managedcluster_status:
    clusters: >-
      {{
        _acm_mc_readiness_read.resources
        | selectattr('metadata.name', 'ne', 'local-cluster')
        | list
      }}
  register: acm_switchover_cluster_status_result

# The published result keeps its contract (passed, total, pending, missing) and is the
# readiness decision itself; a soft first pass that never became ready stays failed for
# downstream klusterlet remediation.
- name: Publish the managed cluster group readiness
  ansible.builtin.set_fact:
    acm_switchover_cluster_verify_result: >-
      {{
        {
          'passed': _acm_mc_readiness.ready,
          'code': _acm_mc_readiness.code,
          'total': _acm_mc_readiness.count,
          'missing': _acm_mc_readiness.missing,
          'pending': _acm_mc_readiness.pending
            + ([] if _acm_mc_readiness.ready else ['managed-cluster-status-timeout']),
        }
      }}

- name: Publish managed-cluster verification compatibility aliases
  ansible.builtin.set_fact:
    cluster_status_result: "{{ acm_switchover_cluster_status_result }}"
    acm_cluster_verify_result: "{{ acm_switchover_cluster_verify_result }}"
