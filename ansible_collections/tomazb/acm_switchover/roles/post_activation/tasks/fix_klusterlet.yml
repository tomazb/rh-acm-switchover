---
# Mirrors Python _force_klusterlet_reconnect() in modules/post_activation.py with
# bounded concurrency inside the custom module.

- name: Identify clusters eligible for remediation
  ansible.builtin.set_fact:
    _klusterlet_fix_candidates: >-
      {{
        (
          _klusterlet_remediation_candidates
          | default(acm_cluster_verify_result.pending | default([]))
        )
        | unique
        | list
      }}

- name: Skip klusterlet fix when no remediation candidates have kubeconfigs
  ansible.builtin.debug:
    msg: >-
      No klusterlet remediation possible — pending clusters
      {{ acm_cluster_verify_result.pending | default([]) | join(', ') }}
      do not have entries in acm_switchover_managed_clusters
  when: _klusterlet_fix_candidates | length == 0

- name: Fix klusterlet for eligible clusters
  tomazb.acm_switchover.acm_klusterlet_remediate:
    secondary_hub:
      kubeconfig: "{{ acm_switchover_hubs.secondary.kubeconfig }}"
      context: "{{ acm_switchover_hubs.secondary.context | default(omit) }}"
    managed_clusters: "{{ acm_switchover_managed_clusters | default({}) }}"
    pending_clusters: "{{ _klusterlet_fix_candidates }}"
    workers: "{{ acm_switchover_execution.concurrency.klusterlet_remediation_workers | default(10) | int }}"
    strict: "{{ acm_switchover_features.klusterlet.strict_remediation | default(false) | bool }}"
  register: _klusterlet_remediation_result
  when: _klusterlet_fix_candidates | length > 0
