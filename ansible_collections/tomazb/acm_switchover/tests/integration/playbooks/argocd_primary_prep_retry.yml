---
- name: Exercise primary-prep Argo CD checkpoint retry
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Establish trusted hub identity before primary-prep retry exercise
      tomazb.acm_switchover.checkpoint_phase:
        identity_barrier: true
        phase: preflight
        status: enter
        checkpoint: "{{ acm_switchover_execution.checkpoint | default({}) }}"
        hubs: "{{ acm_switchover_hubs | default({}) }}"
        operation: "{{ acm_switchover_operation | default({}) }}"
        execution: "{{ acm_switchover_execution | default({}) }}"
        test_overrides: "{{ acm_switchover_test_overrides | default({}) }}"
        collection_version: "{{ acm_switchover_collection_version | default('') }}"

    - name: Run primary-prep role
      ansible.builtin.include_role:
        name: tomazb.acm_switchover.primary_prep

    - name: Report sanitized primary-prep Argo CD summary
      ansible.builtin.debug:
        msg: >-
          PRIMARY_PREP_PAUSED={{ (acm_switchover_argocd_summary | default({})).get('paused', 0) | int }}
          PRIMARY_NAMESPACES={{
            (acm_switchover_argocd_discovery_namespaces | default({})).get('primary', []) | length
          }}
