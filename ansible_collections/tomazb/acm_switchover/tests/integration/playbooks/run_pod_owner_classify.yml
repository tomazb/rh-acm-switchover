---
# Drives the SHIPPED acm_pod_owner_classify module against a real HTTP API, so the runtime
# tests exercise the module as Ansible packages and runs it, through the real kubernetes.core
# client, rather than calling its Python directly.
- name: Run one MCH identity operation
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Capture or classify
      tomazb.acm_switchover.acm_pod_owner_classify:
        operation: "{{ poc_operation }}"
        kubeconfig: "{{ poc_kubeconfig }}"
        context: "{{ poc_context }}"
        namespace: open-cluster-management
        mch_teardown_key: "{{ poc_mch_teardown_key | default(omit) }}"
        mch_expected_uid: "{{ poc_mch_expected_uid | default(omit) }}"
        operator_deployment: "{{ poc_operator_deployment | default(omit) }}"
        operator_identity_unavailable: "{{ poc_operator_identity_unavailable | default(omit) }}"
      register: poc_result
      ignore_errors: true
      # The shipped invocation contract: the arguments carry a kubeconfig path.
      no_log: true

    - name: Publish the module outcome for the test to read
      ansible.builtin.copy:
        content: "{{ poc_result | to_json }}"
        dest: "{{ poc_result_path }}"
        mode: "0644"
      # Test scaffolding, not part of what --check previews.
      check_mode: false
