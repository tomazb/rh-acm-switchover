---
- name: Exercise the complete Argo CD discovery role path
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run Argo CD management
      ansible.builtin.include_role:
        name: tomazb.acm_switchover.argocd_manage
      vars:
        _argocd_discover_hub: primary

    - name: Publish sanitized discovery outcome
      ansible.builtin.debug:
        msg: >-
          DISCOVERY_STATUS={{
            acm_switchover_argocd_discovery_status.status | default('missing')
          }}
          INSTALLED={{ acm_switchover_argocd_installed }}
          DISCOVERED={{ acm_switchover_argocd_all_apps | length }}
          HAS_RUN_ID={{ (acm_switchover_argocd.run_id | default('') | length) > 0 }}
