---
# #284 decision 5: drive the shipped kubeconfig generation tasks without a cluster, so a
# native --check run can be observed. The plan is a fixed stand-in for acm_rbac_bootstrap.
- name: Exercise the shipped rbac_bootstrap kubeconfig generation tasks
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _rbac_plan:
      role: operator
      role_targets:
        - operator
      assets: []
  tasks:
    - name: Run kubeconfig generation
      ansible.builtin.include_role:
        name: tomazb.acm_switchover.rbac_bootstrap
        tasks_from: generate_kubeconfigs

    - name: Publish a safe completion marker
      ansible.builtin.debug:
        msg: "RBAC_KUBECONFIG_GENERATION=done"
