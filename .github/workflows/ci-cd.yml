name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, ansible ]
  pull_request:
    branches: [ main, develop, ansible ]
  schedule:
    # Run security scan weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Run root tests with coverage
      run: |
        python -m pytest tests/ --ignore=tests/release -v -m "not e2e" -n auto --dist worksteal --cov=. --cov-report=xml --cov-report=html --cov-report=term --junitxml=pytest-results-${{ matrix.python-version }}.xml

    - name: Archive pytest results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: pytest-results-${{ matrix.python-version }}.xml
        if-no-files-found: ignore
        retention-days: 7
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.python-version }}
        fail_ci_if_error: false
        
    - name: Archive coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov/
        retention-days: 7

  kubernetes-min-client:
    # R4-06 PR 3 (amendment 2026-10-15 §6): the real-loader snapshot, credential, TLS and
    # endpoint regressions of both form factors, against the declared minimum Python
    # `kubernetes` client. `kubernetes>=28.0.0` has no 28.0.0 final release, so the minimum
    # is 28.1.0; the first step proves that, so the pin cannot silently drift. 28.1.0
    # requires urllib3<2: the repository's other runtime dependencies are installed without
    # the root urllib3 floor (see #358 for the root CLI's effective floor).
    name: Kubernetes client minimum (28.1.0)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Prove 28.1.0 is the lowest final release satisfying the declared floor
      run: |
        python -m pip install --upgrade pip
        if pip install --dry-run --no-deps "kubernetes>=28.0.0,<28.1.0"; then
          echo "a final kubernetes release below 28.1.0 now satisfies >=28.0.0; update this job's pin" >&2
          exit 1
        fi

    - name: Install the minimum client and the test dependencies
      run: |
        grep -v -E '^(urllib3|kubernetes)' requirements.txt > "$RUNNER_TEMP/requirements-min-client.txt"
        pip install -r "$RUNNER_TEMP/requirements-min-client.txt" "kubernetes==28.1.0" pytest

    - name: Assert the resolved client version
      run: |
        python -c "import kubernetes, urllib3; assert kubernetes.__version__ == '28.1.0', kubernetes.__version__; print('kubernetes', kubernetes.__version__, 'urllib3', urllib3.__version__)"

    - name: Run the real-loader regressions on the minimum client
      run: |
        python -m pytest -v \
          tests/test_r4_06_snapshot_parity.py \
          tests/test_post_activation_snapshot.py \
          tests/test_r4_06_endpoint_parity.py \
          tests/test_r4_06_kubeconfig_parity.py \
          ansible_collections/tomazb/acm_switchover/tests/unit/plugins/modules/test_acm_klusterlet_snapshot.py \
          --junitxml=pytest-results-kubernetes-min-client-28.1.0.xml

    - name: Archive pytest results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-results-kubernetes-min-client-28.1.0
        path: pytest-results-kubernetes-min-client-28.1.0.xml
        if-no-files-found: ignore
        retention-days: 7

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Run flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics
        
    - name: Run pylint
      run: |
        pylint acm_switchover.py lib/ modules/ --exit-zero --max-line-length=120 --disable=C0103,C0114,C0115,C0116
        
    - name: Check code formatting with black
      run: |
        black --check --line-length 120 --diff acm_switchover.py lib modules ansible_collections/tomazb/acm_switchover/plugins ansible_collections/tomazb/acm_switchover/tests tests
        
    - name: Check import sorting with isort
      run: |
        isort --check-only --profile black --line-length 120 acm_switchover.py lib modules ansible_collections/tomazb/acm_switchover/plugins ansible_collections/tomazb/acm_switchover/tests tests
        
    - name: Run type checking with mypy
      run: |
        mypy --explicit-package-bases acm_switchover.py lib/ modules/ ansible_collections/tomazb/acm_switchover/plugins ansible_collections/tomazb/acm_switchover/tests --ignore-missing-imports --no-strict-optional
        
    - name: Run bandit security linter
      run: |
        bandit --ini .bandit -f json -o bandit-report.json || true
        bandit --ini .bandit -f txt
        
    - name: Upload bandit report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-security-report
        path: bandit-report.json
        retention-days: 30

  release-framework:
    name: Release Framework Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run release framework helper tests
      run: |
        python -m pytest tests/release -q

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: python
        
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true
        
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

  syntax-check:
    name: Python Syntax Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Compile Python files
      run: |
        python -m py_compile acm_switchover.py
        python -m py_compile lib/*.py
        python -m py_compile modules/*.py
        python -m py_compile tests/*.py
        echo "✓ All Python files compile successfully"

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Check documentation files exist
      run: |
        required_docs=(
          "README.md"
          "LICENSE"
          "CHANGELOG.md"
          "CONTRIBUTING.md"
          "docs/README.md"
          "docs/operations/quickref.md"
          "docs/operations/usage.md"
          "docs/getting-started/install.md"
          "docs/getting-started/container.md"
          "docs/deployment/rbac-requirements.md"
          "docs/deployment/rbac-deployment.md"
          "docs/development/architecture.md"
          "docs/development/testing.md"
          "docs/development/release-validation-framework.md"
          "docs/development/ci.md"
          "docs/deployment/rbac-live-certification.md"
          "docs/reference/validation-rules.md"
          "docs/project/prd.md"
          "docs/project/summary.md"
          "docs/project/deliverables.md"
          "docs/ACM_SWITCHOVER_RUNBOOK.md"
        )
        
        for doc in "${required_docs[@]}"; do
          if [ ! -f "$doc" ]; then
            echo "Error: Required documentation file '$doc' is missing"
            exit 1
          fi
        done
        echo "✓ All required documentation files present"
        
    - name: Check markdown links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'
        config-file: '.github/markdown-link-check.json'
      continue-on-error: true

  integration-test:
    name: Integration Tests (Dry-Run)
    runs-on: ubuntu-latest
    needs: [test, lint, syntax-check]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Test CLI flag-only help surface
      shell: bash
      run: |
        set -euo pipefail
        help_output="$(python acm_switchover.py --help)"
        printf '%s\n' "$help_output"
        for flag in \
          --primary-context \
          --secondary-context \
          --method \
          --old-hub-action \
          --validate-only \
          --dry-run \
          --decommission \
          --restore-only \
          --argocd-resume-only; do
          grep -q -- "$flag" <<<"$help_output"
        done
        
    - name: Test version display
      run: |
        python -c "from lib import __version__, __version_date__; print(f'ACM Switchover {__version__} ({__version_date__})')"
        
    - name: Validate state file structure
      run: |
        python -c "
        import json
        from lib.utils import StateManager
        state = StateManager('/tmp/test-state.json')
        state.save_state()
        with open('/tmp/test-state.json', 'r') as f:
            data = json.load(f)
            assert 'current_phase' in data
            assert 'completed_steps' in data
            assert 'config' in data
            assert 'errors' in data
        print('State file structure valid')
        "

  build-container:
    name: Container Build Test
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build container image
      shell: bash
      run: |
        set -o pipefail
        docker buildx build \
          --progress=plain \
          --load \
          --tag acm-switchover:test \
          --file ./container-bootstrap/Containerfile \
          . 2>&1 | tee container-build.log

    - name: Archive container build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: container-build-log
        path: container-build.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Test container
      run: |
        docker run --rm acm-switchover:test --help

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [test, kubernetes-min-client, lint, release-framework, security, syntax-check, documentation, integration-test]
    if: always()
    
    steps:
    - name: Check job statuses
      run: |
        echo "Test: ${{ needs.test.result }}"
        echo "Kubernetes client minimum: ${{ needs.kubernetes-min-client.result }}"
        echo "Lint: ${{ needs.lint.result }}"
        echo "Release framework: ${{ needs.release-framework.result }}"
        echo "Security: ${{ needs.security.result }}"
        echo "Syntax: ${{ needs.syntax-check.result }}"
        echo "Documentation: ${{ needs.documentation.result }}"
        echo "Integration: ${{ needs.integration-test.result }}"
