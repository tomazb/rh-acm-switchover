name: One-time Thermos tracker update

on:
  push:
    branches:
      - docs/thermos-post-r2-delta-tracker
  pull_request:
    branches:
      - ansible

permissions:
  contents: write

jobs:
  update-tracker:
    if: >-
      github.ref == 'refs/heads/docs/thermos-post-r2-delta-tracker' ||
      github.head_ref == 'docs/thermos-post-r2-delta-tracker'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tracker branch
        uses: actions/checkout@v6
        with:
          ref: docs/thermos-post-r2-delta-tracker
          fetch-depth: 0

      - name: Apply validated post-Review 2 delta
        run: python .tmp-update-thermos-tracker.py

      - name: Validate and commit tracker-only result
        shell: bash
        run: |
          git diff --check
          git rm \
            .github/workflows/tmp-thermos-tracker-update.yml \
            .tmp-update-thermos-tracker.py \
            .tmp-thermos-update-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thermos-resolution-plan.md
          git diff --cached --check
          git commit -m "docs: record post-review Thermos delta"
          git push origin HEAD:docs/thermos-post-r2-delta-tracker
