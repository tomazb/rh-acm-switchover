name: ansible-collection-foundation

# Lanes and versions are governed by
# ansible_collections/tomazb/acm_switchover/docs/compatibility.md and enforced by
# ansible_collections/tomazb/acm_switchover/tests/unit/test_compatibility_contract.py.
# Changing the matrix below without changing that document fails the guardrail tests.

on:
  pull_request:
  push:
    branches: [main, ansible]

jobs:
  foundation:
    name: foundation (${{ matrix.lane }} / ansible-core ${{ matrix.ansible_core }} / py${{ matrix.python }})
    runs-on: ubuntu-latest
    # This job runs pull-request-controlled commands (pip, ansible-galaxy,
    # pytest, ansible-playbook) after checkout, so it takes no more than read
    # access and does not leave a usable token in the checkout.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Declared floor, and the default ansible-core of AAP 2.5/2.6/2.7.
          - lane: min
            ansible_core: "2.16.*"
            python: "3.11"
          # Newest tested series. ansible-core 2.21 requires Python >= 3.12.
          - lane: current
            ansible_core: "2.21.*"
            python: "3.12"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install foundation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==${{ matrix.ansible_core }}" pytest PyYAML "kubernetes>=28.0.0"
      - name: Install collection dependencies
        run: |
          ansible-galaxy collection install -r ansible_collections/tomazb/acm_switchover/requirements.yml
      - name: Verify resolved dependency compatibility
        run: |
          export ANSIBLE_COLLECTIONS_PATH="${GITHUB_WORKSPACE}:${HOME}/.ansible/collections"
          PYTHONPATH=. pytest ansible_collections/tomazb/acm_switchover/tests/unit/test_compatibility_contract.py -q
      - name: Run collection unit tests
        run: |
          PYTHONPATH=. pytest ansible_collections/tomazb/acm_switchover/tests/unit/ -q
      - name: Run collection integration tests
        run: |
          export ANSIBLE_COLLECTIONS_PATH="${GITHUB_WORKSPACE}:${HOME}/.ansible/collections"
          PYTHONPATH=. pytest ansible_collections/tomazb/acm_switchover/tests/integration/ -q
      - name: Run collection scenario tests
        run: |
          export ANSIBLE_COLLECTIONS_PATH="${GITHUB_WORKSPACE}:${HOME}/.ansible/collections"
          PYTHONPATH=. pytest ansible_collections/tomazb/acm_switchover/tests/scenario/ -q
      - name: Syntax check playbooks
        run: |
          set -o pipefail
          export ANSIBLE_COLLECTIONS_PATH="${GITHUB_WORKSPACE}:${HOME}/.ansible/collections"
          log="$(mktemp)"
          status=0
          for playbook in ansible_collections/tomazb/acm_switchover/playbooks/*.yml; do
            echo "== ${playbook}"
            ansible-playbook "${playbook}" --syntax-check 2>&1 | tee -a "${log}" || status=1
          done
          if [ "${status}" -ne 0 ]; then
            echo "::error::playbook syntax check failed"
            exit 1
          fi
          # A resolved collection that does not support this lane's ansible-core
          # must fail the lane, not warn inside a passing job.
          if grep -qE "does not support Ansible version" "${log}"; then
            echo "::error::a collection reported an unsupported ansible-core version for this lane"
            grep -nE "does not support Ansible version" "${log}"
            exit 1
          fi
      - name: Build collection archive
        run: |
          cd ansible_collections/tomazb/acm_switchover
          ansible-galaxy collection build --output-path /tmp/dist
