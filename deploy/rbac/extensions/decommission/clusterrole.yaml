---
# ClusterRole for ACM Switchover Decommission
# Grants the cluster-scoped reads and deletes needed for hub teardown.
# Baseline operator RBAC already grants MCO get/list/delete for normal finalization, and
# the base deployment binds that ClusterRole to the same service account this extension
# is bound to. The MCO rule is repeated here so this extension is self-consistent on its
# own terms: a validator or certification run that inspects only the decommission
# extension must find the reads the standalone teardown actually issues.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: acm-switchover-decommission
  labels:
    app.kubernetes.io/name: acm-switchover
    app.kubernetes.io/component: decommission
    app.kubernetes.io/role: operator
rules:
  - apiGroups: ["hive.openshift.io"]
    resources: ["clusterdeployments"]
    verbs: ["list"]
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["delete"]
  - apiGroups: ["operator.open-cluster-management.io"]
    resources: ["multiclusterhubs"]
    verbs: ["delete"]
  # `get` is here so this extension is self-consistent with the calls the standalone
  # teardown in modules/decommission.py makes: a strict named GET before the delete and
  # a final absence proof after it. The extension is not self-sufficient on its own --
  # its other reads (namespaces get, managedclusters/multiclusterhubs/MCO list, pods)
  # still come from the baseline operator role bound to the same service account.
  - apiGroups: ["observability.open-cluster-management.io"]
    resources: ["multiclusterobservabilities"]
    verbs: ["get", "delete"]
