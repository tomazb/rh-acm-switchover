---
# PlacementRule to apply policy to all managed clusters (or specific clusters)
apiVersion: apps.open-cluster-management.io/v1
kind: PlacementRule
metadata:
  name: placement-policy-acm-switchover-rbac
  namespace: open-cluster-management-policies
spec:
  clusterConditions:
    - status: "True"
      type: ManagedClusterConditionAvailable
  clusterSelector:
    matchExpressions:
      - key: vendor
        operator: In
        values:
          - OpenShift

---
# PlacementBinding to bind policy to placement rule
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-policy-acm-switchover-rbac
  namespace: open-cluster-management-policies
placementRef:
  name: placement-policy-acm-switchover-rbac
  kind: PlacementRule
  apiGroup: apps.open-cluster-management.io
subjects:
  - name: policy-acm-switchover-rbac
    kind: Policy
    apiGroup: policy.open-cluster-management.io
