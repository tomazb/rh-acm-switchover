---
# ACM Policy to enforce and validate baseline RBAC for ACM Switchover.
# The opt-in decommission extension remains separate to preserve least privilege.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-acm-switchover-rbac
  namespace: open-cluster-management-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.AC Identity Management Authentication and Access Control
    policy.open-cluster-management.io/controls: PR.AC-4 Access Control
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-acm-switchover-baseline-rbac
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: acm-switchover
                  labels:
                    app.kubernetes.io/name: acm-switchover
                    app.kubernetes.io/component: automation
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: acm-switchover-operator
                  namespace: acm-switchover
                  labels:
                    app.kubernetes.io/name: acm-switchover
                    app.kubernetes.io/component: operator
                    app.kubernetes.io/role: operator
                automountServiceAccountToken: true
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: acm-switchover-validator
                  namespace: acm-switchover
                  labels:
                    app.kubernetes.io/name: acm-switchover
                    app.kubernetes.io/component: validator
                    app.kubernetes.io/role: validator
